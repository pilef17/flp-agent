ões sem Bola", "d": "O adulto mostra cores; o atleta corre para o cone correspondente.", "min": 15, "blocks": [], "params": ["Reações: 3×6"], "tip": "⚡ Treinar os olhos antes dos pés", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Receber e Decidir em 3 s", "d": "O adulto passa e mostra o sinal: remate, passe para mini-baliza ou condução.", "min": 15, "blocks": [], "params": ["Repetições: 3×6"], "tip": "⚡ Decisão antes do toque", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Receber e Decidir em 2 s", "d": "Igual, com limite de 2 s e pressão do adulto pelas costas.", "min": 12, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ Velocidade de pensamento", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Decisão Livre", "d": "Sem sinal: o atleta lê a posição do adulto (fecha remate ou passe) e escolhe sozinho.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ O defensor diz-te a resposta", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Corredor de Alta Intensidade", "d": "Circuito: apelo → receção → decisão → finalização → sprint de recuperação. 6 voltas.", "min": 18, "blocks": [], "params": ["Voltas: 6", "Pausa: 75 s"], "tip": "⚡ Qualidade de decisão sob fadiga", "warm": false}]}, {"t": "Integração Total", "sub": "Sessão-teste com todos os pilares do avançado", "phase": 3, "obj": [["Objetivos da Sessão", ["Integrar apelos, apoio, finalização e pressão", "Medir a evolução", "Qualidade sob fadiga", "Decisões certas"]], ["Comportamentos a Exigir", ["Concentração", "Intensidade de jogo", "Coragem", "Técnica até ao fim"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Aquecimento de Jogo", "d": "Aquecimento completo até 90%.", "min": 15, "blocks": [], "params": ["Duração: 15 min"], "tip": "⚡ Hoje mede-se a evolução", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Teste de Apelos + Finalização", "d": "10 apelos com finalização. Registar golos.", "min": 12, "blocks": [], "params": ["Repetições: 10"], "tip": "⚡ Comparar com a sessão 2", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Teste de Finalização", "d": "20 finalizações variadas. Registar pontos.", "min": 12, "blocks": [], "params": ["Finalizações: 20"], "tip": "⚡ Comparar com a sessão 4", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Teste de Frente a Frente", "d": "10 frente a frente. Registar golos.", "min": 12, "blocks": [], "params": ["Repetições: 10"], "tip": "⚡ Comparar com a sessão 6", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Circuito Final", "d": "Apoio de costas → devolução → apelo → finalização → pressão → recuperação. 4 voltas cronometradas.", "min": 24, "blocks": [], "params": ["Voltas: 4", "Pausa: 2 min"], "tip": "⚡ Enviar os resultados ao treinador", "warm": false}]}], "zag": [{"t": "Postura Defensiva e Encaminhar", "sub": "Corpo de lado, apoios ativos e levar o atacante para o lado fraco", "phase": 1, "obj": [["Objetivos da Sessão", ["Dominar a posição de corpo de lado (45°)", "Encaminhar o atacante para fora / pé fraco", "Manter distância de 1–1,5 m ao portador", "Atacar a bola só no momento certo"]], ["Comportamentos a Exigir", ["Peso na ponta dos pés, joelhos fletidos", "Nunca cruzar as pernas no recuo", "Paciência: não mergulhar", "Comunicar em voz alta (\"meu!\", \"fora!\")"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Apoios e Recuos", "d": "Escada de cones (6 cones a 1 m): skipping, passo lateral, recuo de costas e corrida em 'Z'. O adulto dá o sinal e o atleta muda de padrão. Terminar com 4 recuos de 10 m + arranque de 10 m para a frente.", "min": 15, "blocks": [], "params": ["Séries: 4", "Recuo + arranque: 4×10 m", "Descanso: 30 s"], "tip": "⚡ Recuo sempre com passos curtos — é o movimento base do central", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Recuo de Lado em Corredor", "d": "Corredor de 5×15 m. O adulto conduz a bola a velocidade moderada; o central recua de lado (45°), mantém 1–1,5 m e encaminha para a linha marcada com cones. Sem tentar roubar: só posicionamento.", "min": 12, "blocks": [], "params": ["Repetições: 8 por lado", "Velocidade: 60–70%"], "tip": "⚡ Ombro de dentro mais à frente que o de fora — assim fecha o centro", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Encaminhar para o Pé Fraco", "d": "O adulto parte com bola a 15 m e escolhe o lado. O central fecha o pé forte do adulto e obriga a conduzir para o lado definido (cone azul). Ponto quando o adulto termina no lado errado para ele.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Troca de lado a cada 5"], "tip": "⚡ Decide cedo para onde queres mandar o atacante — e mostra-lhe só esse caminho", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Momento do Desarme", "d": "O adulto conduz e faz um toque longo de propósito em momentos aleatórios. O central só ataca a bola quando ela se afasta do pé do adulto. Desarme frontal ou de lado, sem falta.", "min": 15, "blocks": [], "params": ["Repetições: 12", "Descanso: 20 s"], "tip": "⚡ Atacar a bola no toque longo, nunca quando está colada ao pé", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "1×1 Defensivo até Mini-Baliza", "d": "O adulto ataca duas mini-balizas de cones (3 m) a partir de 20 m; o central defende. Se roubar, sai a conduzir até à linha de 10 m. 6 duelos por série com 45 s de pausa.", "min": 18, "blocks": [], "params": ["Séries: 3 × 6 duelos", "Intensidade: alta"], "tip": "⚡ Contar: duelos ganhos vs. perdidos — registar no diário", "warm": false}]}, {"t": "Cabeceamento Defensivo", "sub": "Tempo de salto, ponto de contacto e altura/direção do alívio", "phase": 1, "obj": [["Objetivos da Sessão", ["Ler a trajetória cedo", "Saltar com 1 pé (com corrida) e com 2 pés (parado)", "Cabecear com a testa, olhos abertos", "Afastar alto, longe e para fora"]], ["Comportamentos a Exigir", ["Atacar a bola no ponto mais alto", "Braços para proteção e equilíbrio, sem falta", "Pescoço firme, força do tronco", "Aterragem equilibrada e pronta para a 2.ª bola"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Salto e Pescoço", "d": "Saltos a pés juntos (3×6), saltos a 1 pé (2×5 por perna), mobilidade do pescoço e 10 cabeceamentos leves com bola lançada à mão pelo adulto a 3 m.", "min": 15, "blocks": [], "params": ["Saltos: 3×6 + 2×5/perna", "Cabeceamentos: 10 leves"], "tip": "⚡ Aterrar sempre suave, joelhos alinhados com os pés", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Cabeceamento Parado — Direção", "d": "O adulto lança à mão a 5–6 m. O central cabeceia para alvos: cones à esquerda, direita e longe. Sem salto primeiro, depois com salto a 2 pés.", "min": 12, "blocks": [], "params": ["Repetições: 3×8", "Alvos: 3 zonas"], "tip": "⚡ Testa na bola, não a bola na testa — vai ao encontro dela", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Salto com Corrida — 1 Pé", "d": "O central parte 4 m atrás, corre e salta a 1 pé para cabecear bola lançada alta pelo adulto. Afastar para fora da área (zona marcada a 20 m).", "min": 15, "blocks": [], "params": ["Repetições: 3×6", "Descanso: 30 s"], "tip": "⚡ A corrida dá altura — chegar à bola antes de ela chegar a ti", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Cruzamentos Longos — Afastar", "d": "O adulto cruza com o pé de 25–30 m (ou lança forte à mão). O central ajusta a posição, salta e afasta alto e longe. Variar a altura e a velocidade.", "min": 15, "blocks": [], "params": ["Repetições: 15–20", "Distância do alívio: >15 m"], "tip": "⚡ Se não dá para controlar a direção, afasta alto e longe — nunca para o meio", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Desafio Aéreo com Contacto Leve", "d": "O adulto lança e encosta com um escudo ou o próprio ombro (contacto leve). O central tem de ganhar a posição, saltar e afastar. Pontuação: alívio limpo = 2, toque = 1.", "min": 18, "blocks": [], "params": ["Séries: 3 × 8", "Pausa: 60 s"], "tip": "⚡ G ntscheidenden Raum hinter der Linie verstehen"]], ["Geforderte Verhaltensweisen", ["Explosiver Antritt im richtigen Moment", "Kopf hoch vor dem Lauf", "Mit dem Arm dem Passgeber den Raum zeigen", "Nie stehen bleiben: den Lauf wiederholen, wenn kein Ball kommt"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aktivierungsläufe + Richtungswechsel", "d": "Auf 20×15 m Läufe mit Richtungswechseln auf Signal des Erwachsenen (Stimme oder Arm): Lauf → kurze Beschleunigung → Stopp → neue Richtung. Zum Schluss 3 Sprints über 15 m aus der Bewegung.", "min": 15, "blocks": [], "params": ["Serien: 3", "Sprint: 15 m", "Pause: 30 s"], "tip": "⚡ Der Stürmer startet selten aus dem Stand — die Beschleunigung aus der Bewegung simulieren", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Direkter Lauf — in den Rücken", "d": "Der Erwachsene steht 25 m entfernt mit Ball. Der Stürmer stellt sich neben ein Verteidiger-Hütchen. Bei Blickkontakt startet er gerade in den Raum hinter dem Hütchen; der Erwachsene spielt in die Tiefe; Abschluss aufs Tor.", "min": 12, "blocks": [], "params": ["Wiederholungen: 8–10 pro Seite", "Pause: 20 s"], "tip": "⚡ Nicht starten, bevor der Passgeber bereit ist — Blickkontakt ist Pflicht", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Kreuzlauf — Annahme auf dem Starken Fuss", "d": "2 Hütchen im Abstand von 4 m = Innenverteidiger. Der Stürmer startet aussen, täuscht den direkten Lauf an und zieht in die Lücke zwischen den Hütchen. Der Erwachsene passt in die Lücke; Annahme Richtung Tor.", "min": 12, "blocks": [], "params": ["Wiederholungen: 8 pro Seite", "Abschluss: aufs Tor"], "tip": "⚡ Bereits mit Blick zum Tor annehmen, auf dem starken Fuss", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Abfolge: Direkter Lauf + Kreuzlauf", "d": "Zwei Läufe hintereinander: der 1. (direkt) ohne Ball; schnell neu positionieren; der 2. (Kreuzlauf) mit Ball und Abschluss. Reihenfolge jede Serie wechseln.", "min": 15, "blocks": [], "params": ["Serien: 6", "Pause: 30 s"], "tip": "⚡ Vor einem Tor gibt es viele Läufe ins Leere — jeder Lauf schafft Raum für den nächsten", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "1-gegen-1 in die Tiefe mit Abschluss", "d": "Der Erwachsene spielt in die Tiefe und verfolgt den Stürmer (halbaktiver Gegner, 2 m Rückstand). Der Stürmer wählt den richtigen Lauf, nimmt an und schliesst ab (Erwachsener im Tor oder Hütchen in den Ecken).", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Intensität: hoch"], "tip": "⚡ Bewerten: richtiger Lauf? Tempo nach der Annahme gehalten?", "warm": false}]}, {"t": "Gegenbewegung und Bogenlauf", "sub": "Den Verteidiger aus dem Gleichgewicht bringen und das Abseits intelligent steuern", "phase": 1, "obj": [["Ziele der Einheit", ["Die Gegenbewegung beherrschen: locken und starten", "Den Bogenlauf ohne Abseits ausführen", "Mit der ersten Bewegung täuschen", "Beide Bewegungen mit dem Passgeber abstimmen"]], ["Geforderte Verhaltensweisen", ["Überzeugende erste Bewegung", "Explosiver Richtungswechsel", "Bogenlauf: erst parallel zur Linie, dann hinein", "Klare Kommunikation mit dem Passgeber"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Schattenlauf mit dem Erwachsenen", "d": "Spieler und Erwachsener gegenüber: der Spieler führt und wechselt ohne Ankündigung die Richtung; der Erwachsene folgt. Nach 2 min Rollen tauschen. Zum Schluss 5 Antritte über 10 m mit dem Rücken: drehen und laufen.", "min": 15, "blocks": [], "params": ["Dauer: 2×3 min pro Rolle", "Schlusssprint: 5×10 m"], "tip": "⚡ Aktiviert die Reaktion mit dem Rücken zum Spiel", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Gegenbewegung — Lernphase", "d": "Der Stürmer neben einem Verteidiger-Hütchen. Phase 1: 3–4 Schritte zum Erwachsenen (Anbieten). Phase 2: Explosion in den Raum hinter dem Hütchen. Der Erwachsene passt im Moment der Gegenbewegung.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10 pro Seite", "Abschluss: ja"], "tip": "⚡ Das Anbieten muss überzeugen — der Verteidiger muss 'anbeissen'", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Bogenlauf — Abseits Steuern", "d": "3 Hütchen in einer Linie = Abwehr. Der Stürmer läuft seitlich an der Linie mit und taucht diagonal in den Strafraum ein, sobald der Erwachsene den Ball spielt. Mit dem Handy filmen, um das Abseits zu prüfen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Analyse: Video"], "tip": "⚡ Genau im Moment des Passes starten — der Bogen hält dich länger onside", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Freie Wahl — Welcher Lauf?", "d": "Der Erwachsene stellt sich als Verteidiger in verschiedene Positionen (eng, weit, frontal). Der Stürmer wählt den passenden Lauf; der Erwachsene passt, Abschluss.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12", "Besprechung: alle 3"], "tip": "⚡ Fragen: 'Welchen Lauf? Warum? Wo stand der Verteidiger?'", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Lauf-Wettbewerb", "d": "12 verschiedene Läufe. 1 Punkt pro Tor, 0,5 für einen perfekten Lauf ohne Tor. Notieren und nächstes Mal übertreffen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12", "Notieren: Punkte"], "tip": "⚡ Der Lauf hat Wert, auch ohne Ball", "warm": false}]}, {"t": "Anspielstation — Mit dem Rücken zum Tor", "sub": "Ball abschirmen, Ablage, Aufdrehen und Position zwischen den Linien", "phase": 1, "obj": [["Ziele der Einheit", ["Den Ball mit dem Rücken unter Druck abschirmen", "Saubere direkte Ablage", "Wissen, wann aufdrehen und wann ablegen", "Sich zwischen den Linien positionieren"]], ["Geforderte Verhaltensweisen", ["Breiter Körper: Arme und Beine", "Standfuss weg vom Ball", "Kopf hoch vor der Annahme", "Präzise Ablage, nicht zufällig"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Leichtes Abschirmen mit dem Erwachsenen", "d": "Quadrat 6×6 m. Der Spieler dribbelt und schirmt ab; der Erwachsene presst mit 50 %. Danach Pässe mit dem Rücken: Körper zwischen Ball und Gegner-Hütchen, ablegen.", "min": 15, "blocks": [], "params": ["Dauer: 3×3 min"], "tip": "⚡ Nie frontal zum Gegner annehmen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Abschirmen unter Direktem Druck", "d": "Der Stürmer nimmt mit dem Rücken an, der Erwachsene klebt an ihm. Ziel: Ball 3 s halten und auf ein Zielhütchen ablegen oder aufdrehen, wenn der Erwachsene nicht folgt.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12", "Abschirmen: 3 s"], "tip": "⚡ Breiter Körper, schnelle Gewichtsverlagerung", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Direkte Ablage und Weiterleitung", "d": "Zwei Zielhütchen an verschiedenen Positionen. Der Erwachsene passt; der Stürmer legt direkt auf das angesagte Ziel ab, startet sofort in die Tiefe, erhält einen neuen Pass und schliesst ab.", "min": 15, "blocks": [], "params": ["Serien: 6", "Intensität: mittel-hoch"], "tip": "⚡ Eine schlechte Ablage macht die Aktion kaputt — maximale Präzision", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Binden und Lösen zwischen den Linien", "d": "2 Hütchenpaare = Abwehrlinien. Der Stürmer bewegt sich dazwischen, fordert den Ball vom Erwachsenen und entscheidet: aufdrehen und Richtung Tor dribbeln oder ablegen und die Tiefe angreifen.", "min": 18, "blocks": [], "params": ["Dauer: 3×5 min"], "tip": "⚡ Zwischen den Linien zwingst du die Verteidiger zu entscheiden", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Komplette Kette — Anspiel + Tiefe + Tor", "d": "1) Mit dem Rücken annehmen und abschirmen; 2) zum Erwachsenen ablegen; 3) freier Lauf; 4) annehmen und abschliessen. Verbindet die Einheiten 1, 2 und 3.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Gegner: Erwachsener halbaktiv"], "tip": "⚡ Alle 3 Phasen bewerten: Abschirmen, Ablage und Lauf", "warm": false}]}, {"t": "Abschluss im Strafraum", "sub": "Ausführungstempo, 1–2 Kontakte, Kontaktfläche und den Torhüter lesen", "phase": 2, "obj": [["Ziele der Einheit", ["Direkt und effizient abschliessen", "Vor dem Schuss die Position des Torhüters sehen", "Die richtige Kontaktfläche wählen", "Tempo unter Druck halten"]], ["Geforderte Verhaltensweisen", ["Die meisten Tore fallen im Strafraum", "Die meisten mit 1 oder 2 Kontakten", "Viele Tore nach einer intensiven Aktion", "Im Strafraum nie stillstehen"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Abschluss-Aktivierung", "d": "10 m Sprint → Pass vom Erwachsenen → Schuss in die Ecken (Hütchen). Langsam beginnen, Tempo steigern. Beide Füsse.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10 pro Fuss", "Distanz: 8–14 m"], "tip": "⚡ Von Anfang an: Kopf hoch, um das Tor zu sehen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Abschluss aus 4 Winkeln", "d": "Der Erwachsene spielt von 4 Positionen rund um den Strafraum. Annahme und Schuss mit 1 oder 2 Kontakten. Winkel wechseln; mindestens 3 m Anlauf vor jedem Schuss.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10 pro Winkel", "Pause: 20 s"], "tip": "⚡ Im Strafraum ist ein stehender Stürmer ein toter Stürmer", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Abschlüsse in Serie", "d": "3 Abschlüsse hintereinander: 1) Dribbling + Hütchen ausspielen + Schuss; 2) Doppelpass mit dem Erwachsenen + Schuss; 3) Querpass + Direktschuss.", "min": 15, "blocks": [], "params": ["Serien: 6", "Pause: 45 s"], "tip": "⚡ Den 3. Schuss bewerten: Bleibt die Technik auch müde?", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Eins gegen den Torhüter — Schnelle Entscheidung", "d": "Der Erwachsene im Tor wechselt bei jeder Wiederholung die Position. Der Stürmer erhält den Ball in die Tiefe und entscheidet: flach ins lange Eck, lupfen oder umspielen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Nach der Position des Torhüters entscheiden, im letzten Moment", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Abschluss-Challenge", "d": "20 verschiedene Abschlüsse. Tor = 1 Punkt; direkt = +0,5; perfekte Entscheidung = +0,5. Notieren.", "min": 15, "blocks": [], "params": ["Abschlüsse: 20"], "tip": "⚡ Mit Einheit 10 vergleichen", "warm": false}]}, {"t": "Tore im Zentrum", "sub": "Läufe im Strafraum, toter Winkel und Timing bei der Flanke", "phase": 2, "obj": [["Ziele der Einheit", ["Den toten Winkel des Verteidigers nutzen", "In der Bewegung zur Flanke kommen", "Kurzen Pfosten, langen Pfosten und Elfmeterpunkt angreifen", "In die Richtung schiessen, aus der die Flanke kam"]], ["Geforderte Verhaltensweisen", ["Lauf im Bogen", "Gegenbewegung vor dem Angriff", "Den Ball attackieren, nicht warten", "Direktabschluss"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aktivierung Kopfball und Volley", "d": "Leichte Kopfbälle und Volleys mit vom Erwachsenen aus 5 m zugeworfenem Ball.", "min": 15, "blocks": [], "params": ["Wiederholungen: 20"], "tip": "⚡ Die Technik mit einem Kontakt aktivieren", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Toter Winkel", "d": "Verteidiger-Hütchen im Strafraum. Der Stürmer startet davor, löst sich in dessen Rücken (toter Winkel) und attackiert die Flanke des Erwachsenen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6"], "tip": "⚡ Der Verteidiger kann nicht Ball und dich gleichzeitig sehen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Dorthin Schiessen, Woher die Flanke Kam", "d": "Flanke von rechts: Der Schuss zurück auf die rechte Seite erwischt den Torhüter auf dem falschen Fuss. Seiten wechseln.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Der Torhüter bewegt sich mit dem Ball — schiess hinter ihn", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "3 Angriffszonen", "d": "Der Erwachsene flankt; vorher sagt er '1', '2' oder 'P' (kurzer Pfosten, langer Pfosten, Elfmeterpunkt). Der Stürmer greift die Zone an und schliesst ab.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Im Moment ankommen, nicht vorher", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Flanken-Challenge", "d": "15 verschiedene Flanken. Tore und Schüsse aufs Tor zählen.", "min": 18, "blocks": [], "params": ["Flanken: 15"], "tip": "⚡ Tore/15 notieren", "warm": false}]}, {"t": "Die Kunst des Eins-gegen-den-Torhüter", "sub": "Den Torhüter lesen, die Absicht verbergen und entscheiden", "phase": 2, "obj": [["Ziele der Einheit", ["Die Position des Torhüters lesen", "Wählen: schiessen, lupfen oder umspielen", "Die Absicht bis zum Schluss verbergen", "Den Körper gegen den verfolgenden Verteidiger einsetzen"]], ["Geforderte Verhaltensweisen", ["Tempo bis zum Schuss", "Auf den Torhüter schauen, nicht auf den Ball", "Letzter Kontakt bereitet den Schuss vor", "Ruhe"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Dribbling und Schuss nach Hütchen", "d": "Tempodribbling → Hütchen ausspielen → gerade aufs Tor → Abschluss.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10"], "tip": "⚡ Dribbling mit langen Kontakten in den freien Raum", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Torhüter Wechselt die Position", "d": "Der Erwachsene im Tor nimmt eine von 3 Positionen ein (weit vorne, auf der Linie, herauskommend). Der Stürmer liest und entscheidet.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Weit vorne → lupfen; auf der Linie → lange Ecke; herauskommend → umspielen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Die Absicht Verbergen", "d": "Den Schuss zu einer Seite ansetzen und auf die andere schiessen, oder den Schuss antäuschen und umspielen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Der Körper sagt das eine, der Fuss macht das andere", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "In den Laufweg des Verteidigers", "d": "Der Erwachsene verfolgt von hinten. Der Stürmer bringt seinen Körper in die Laufbahn des Erwachsenen, um ihn abzuhalten.", "min": 12, "blocks": [], "params": ["Wiederholungen: 10"], "tip": "⚡ Den Weg schützen, nicht nur den Ball", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Eins-gegen-den-Torhüter-Wettbewerb", "d": "12 Duelle mit dem Erwachsenen im Tor. Tor = 1, perfekte Entscheidung = +0,5.", "min": 18, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Notieren", "warm": false}]}, {"t": "Pressing und Defensivarbeit des Stürmers", "sub": "Das Zentrum schliessen, lenken und hoch erobern", "phase": 2, "obj": [["Ziele der Einheit", ["Im Bogen pressen", "Den Pass ins Zentrum schliessen", "Den Ballführenden zur Linie lenken", "Erobern und schnell abschliessen"]], ["Geforderte Verhaltensweisen", ["Auslöser: Rückpass oder schlechte Annahme", "Anlaufen im Bogen", "Letzter Schritt abgebremst", "Sofort umschalten nach Ballgewinn"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Antritte und Abbremsen", "d": "Antritte über 5–10 m und Abbremsen in 2 Schritten auf Signal des Erwachsenen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6"], "tip": "⚡ Pressen heisst beschleunigen und abbremsen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Das Zentrum Schliessen", "d": "Der Erwachsene (Innenverteidiger) dribbelt; 2 Hütchen = zentrale Mittelfeldspieler. Der Stürmer presst im Bogen, schliesst den Pass zu den Hütchen und zwingt ihn auf die Linie.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Der Bogen verdeckt den Pass, während du presst", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Pressing-Auslöser", "d": "Der Erwachsene nimmt mit gutem oder schlechtem Kontakt an. Der Stürmer presst nur bei den Auslösern.", "min": 12, "blocks": [], "params": ["Wiederholungen: 15"], "tip": "⚡ Im richtigen Moment pressen ist mehr wert als immer pressen", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Erobern und Abschliessen", "d": "Nach dem Ballgewinn gegen den Erwachsenen in weniger als 6 s abschliessen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10"], "tip": "⚡ Hoch erobern = Tor in der Nähe", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Pressing-Spiel", "d": "Der Erwachsene versucht, den Ball in einem 12×12-m-Quadrat zu halten. 3 Runden à 2 min; Balleroberungen und Tore zählen.", "min": 18, "blocks": [], "params": ["Runden: 3×2 min"], "tip": "⚡ Stürmer führen die intensivsten Pressing-Aktionen aus — trainiere sie", "warm": false}]}, {"t": "Kombinationen mit dem Passgeber", "sub": "Doppelpässe, dritter Mann und Pass in den Lauf", "phase": 3, "obj": [["Ziele der Einheit", ["Schneller Doppelpass mit dem Erwachsenen", "Ablegen und die Tiefe angreifen", "Den Pass des dritten Mannes erhalten", "Nach der Kombination abschliessen"]], ["Geforderte Verhaltensweisen", ["Harter Pass", "Sofort nach dem Pass starten", "Mit dem Arm fordern", "Orientierte Annahme"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Pässe in Bewegung", "d": "Kurze Pässe mit dem Erwachsenen in Bewegung; passen und bewegen.", "min": 15, "blocks": [], "params": ["Dauer: 3×3 min"], "tip": "⚡ Passen und stehen bleiben heisst aus dem Spiel verschwinden", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Doppelpass + Schuss", "d": "Pass zum Erwachsenen, zurück erhalten und schiessen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6"], "tip": "⚡ Nach dem Pass beschleunigen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Ablegen und Tiefe", "d": "Mit dem Rücken annehmen, zum Erwachsenen ablegen und die Tiefe angreifen, um den langen Pass zu erhalten.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Die Ablage ist das Signal für den Lauf", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Dritter Mann mit Hütchen", "d": "Pass zum Erwachsenen; er 'legt' in eine Zone (Hütchen), in der der Stürmer schon im Lauf angekommen ist.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Der Pass, den der Verteidiger nicht sieht", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Kombination + Abschluss", "d": "Ablauf: Doppelpass → Dribbling → Schuss. 12 Wiederholungen; Tore zählen.", "min": 18, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Notieren", "warm": false}]}, {"t": "Entscheidung unter Druck", "sub": "Annehmen, entscheiden und in unter 2 Sekunden ausführen", "phase": 3, "obj": [["Ziele der Einheit", ["Die Optionen vor der Annahme sehen", "In unter 2 s entscheiden", "Variieren: schiessen, passen, dribbeln", "Auch müde mit Qualität ausführen"]], ["Geforderte Verhaltensweisen", ["Scanning vor der Annahme", "Orientierter erster Kontakt", "Sich auf die Entscheidung festlegen", "Ausführungstempo"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Entscheidungen ohne Ball", "d": "Der Erwachsene zeigt Farben; der Spieler läuft zum passenden Hütchen.", "min": 15, "blocks": [], "params": ["Reaktionen: 3×6"], "tip": "⚡ Erst die Augen trainieren, dann die Füsse", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Annehmen und in 3 s Entscheiden", "d": "Der Erwachsene passt und zeigt das Signal: Schuss, Pass aufs Minitor oder Dribbling.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6"], "tip": "⚡ Entscheidung vor dem Kontakt", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Annehmen und in 2 s Entscheiden", "d": "Gleich, mit Limit von 2 s und Druck des Erwachsenen im Rücken.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Denkgeschwindigkeit", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Freie Entscheidung", "d": "Ohne Signal: Der Spieler liest die Position des Erwachsenen (verstellt Schuss oder Pass) und wählt selbst.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12"], "tip": "⚡ Der Verteidiger gibt dir die Antwort", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Hochintensitäts-Korridor", "d": "Parcours: Lauf → Annahme → Entscheidung → Abschluss → Rücksprint. 6 Runden.", "min": 18, "blocks": [], "params": ["Runden: 6", "Pause: 75 s"], "tip": "⚡ Entscheidungsqualität unter Ermüdung", "warm": false}]}, {"t": "Gesamtintegration", "sub": "Testeinheit mit allen Bausteinen des Stürmers", "phase": 3, "obj": [["Ziele der Einheit", ["Läufe, Anspiel, Abschluss und Pressing verbinden", "Die Entwicklung messen", "Qualität unter Ermüdung", "Richtige Entscheidungen"]], ["Geforderte Verhaltensweisen", ["Konzentration", "Spielintensität", "Mut", "Technik bis zum Schluss"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aufwärmen wie vor dem Spiel", "d": "Vollständiges Aufwärmen bis 90 %.", "min": 15, "blocks": [], "params": ["Dauer: 15 min"], "tip": "⚡ Heute wird die Entwicklung gemessen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Test Läufe + Abschluss", "d": "10 Läufe mit Abschluss. Tore notieren.", "min": 12, "blocks": [], "params": ["Wiederholungen: 10"], "tip": "⚡ Mit Einheit 2 vergleichen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Abschluss-Test", "d": "20 verschiedene Abschlüsse. Punkte notieren.", "min": 12, "blocks": [], "params": ["Abschlüsse: 20"], "tip": "⚡ Mit Einheit 4 vergleichen", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Test Eins-gegen-den-Torhüter", "d": "10 Duelle. Tore notieren.", "min": 12, "blocks": [], "params": ["Wiederholungen: 10"], "tip": "⚡ Mit Einheit 6 vergleichen", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Finaler Parcours", "d": "Anspiel mit dem Rücken → Ablage → Lauf → Abschluss → Pressing → Rückweg. 4 Runden mit Zeitmessung.", "min": 24, "blocks": [], "params": ["Runden: 4", "Pause: 2 min"], "tip": "⚡ Ergebnisse an den Trainer senden", "warm": false}]}], "zag": [{"t": "Defensive Grundhaltung und Lenken", "sub": "Seitlich stehen, aktive Füsse und den Stürmer auf die schwache Seite lenken", "phase": 1, "obj": [["Ziele der Einheit", ["Seitliche Körperstellung (45°) beherrschen", "Den Stürmer nach aussen / auf den schwachen Fuss lenken", "1–1,5 m Abstand zum Ballführenden halten", "Den Ball nur im richtigen Moment attackieren"]], ["Geforderte Verhaltensweisen", ["Gewicht auf den Fussballen, Knie gebeugt", "Beim Rückwärtslaufen nie die Beine kreuzen", "Geduld: nicht reingrätschen", "Laut kommunizieren (\"meiner!\", \"raus!\")"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aktivierung Füsse und Rückwärtslaufen", "d": "Hütchenleiter (6 Hütchen à 1 m): Skipping, Sidesteps, Rückwärtslaufen und Lauf im 'Z'. Der Erwachsene gibt das Signal zum Musterwechsel. Zum Schluss 4× 10 m rückwärts + 10 m Antritt nach vorne.", "min": 15, "blocks": [], "params": ["Serien: 4", "Rückwärts + Antritt: 4×10 m", "Pause: 30 s"], "tip": "⚡ Rückwärts immer mit kurzen Schritten — die Grundbewegung des Innenverteidigers", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Seitlich Rückwärts im Korridor", "d": "Korridor 5×15 m. Der Erwachsene dribbelt mit mittlerem Tempo; der Verteidiger läuft seitlich (45°) rückwärts, hält 1–1,5 m und lenkt zur markierten Hütchenlinie. Kein Balleroberungsversuch: nur Positionierung.", "min": 12, "blocks": [], "params": ["Wiederholungen: 8 pro Seite", "Tempo: 60–70 %"], "tip": "⚡ Innere Schulter weiter vorne als die äussere — so schliesst du das Zentrum", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Auf den Schwachen Fuss Lenken", "d": "Der Erwachsene startet mit Ball aus 15 m und wählt die Seite. Der Verteidiger schliesst den starken Fuss und zwingt ihn auf die festgelegte Seite (blaues Hütchen). Punkt, wenn der Erwachsene auf seiner falschen Seite landet.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Seitenwechsel alle 5"], "tip": "⚡ Entscheide früh, wohin du den Stürmer schicken willst — und zeig ihm nur diesen Weg", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Der Moment des Tacklings", "d": "Der Erwachsene dribbelt und legt sich den Ball zu zufälligen Zeitpunkten absichtlich weit vor. Der Verteidiger greift nur an, wenn sich der Ball vom Fuss löst. Frontal oder seitlich, ohne Foul.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12", "Pause: 20 s"], "tip": "⚡ Den Ball beim weiten Kontakt attackieren, nie wenn er am Fuss klebt", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "1-gegen-1 auf Minitore", "d": "Der Erwachsene greift aus 20 m zwei Hütchentore (3 m) an; der Verteidiger verteidigt. Bei Ballgewinn dribbelt er bis zur 10-m-Linie. 6 Duelle pro Serie, 45 s Pause.", "min": 18, "blocks": [], "params": ["Serien: 3 × 6 Duelle", "Intensität: hoch"], "tip": "⚡ Zählen: gewonnene vs. verlorene Duelle — im Tagebuch notieren", "warm": false}]}, {"t": "Defensives Kopfballspiel", "sub": "Absprungzeitpunkt, Trefferpunkt und Höhe/Richtung der Klärung", "phase": 1, "obj": [["Ziele der Einheit", ["Die Flugbahn früh lesen", "Einbeinig (mit Anlauf) und beidbeinig (aus dem Stand) abspringen", "Mit der Stirn köpfen, Augen offen", "Hoch, weit und nach aussen klären"]], ["Geforderte Verhaltensweisen", ["Den Ball am höchsten Punkt attackieren", "Arme für Schutz und Gleichgewicht, ohne Foul", "Fester Nacken, Rumpfspannung", "Stabil landen und bereit für den zweiten Ball"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aktivierung Sprung und Nacken", "d": "Beidbeinige Sprünge (3×6), einbeinige Sprünge (2×5 pro Bein), Nackenmobilität und 10 leichte Kopfbälle, vom Erwachsenen aus 3 m zugeworfen.", "min": 15, "blocks": [], "params": ["Sprünge: 3×6 + 2×5/Bein", "Kopfbälle: 10 leicht"], "tip": "⚡ Immer weich landen, Knie über den Füssen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Kopfball aus dem Stand — Richtung", "d": "Der Erwachsene wirft aus 5–6 m zu. Der Verteidiger köpft auf Ziele: Hütchen links, rechts und weit. Erst ohne Sprung, dann beidbeinig.", "min": 12, "blocks": [], "params": ["Wiederholungen: 3×8", "Ziele: 3 Zonen"], "tip": "⚡ Stirn zum Ball, nicht Ball zur Stirn — geh ihm entgegen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Sprung mit Anlauf — Einbeinig", "d": "Der Verteidiger startet 4 m dahinter, läuft an und springt einbeinig zu einem hoch zugeworfenen Ball. Aus dem Strafraum klären (Zone bei 20 m).", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6", "Pause: 30 s"], "tip": "⚡ Der Anlauf gibt Höhe — sei vor dem Ball am Punkt", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Lange Flanken — Klären", "d": "Der Erwachsene flankt aus 25–30 m mit dem Fuss (oder wirft kräftig). Der Verteidiger stellt sich ein, springt und klärt hoch und weit. Höhe und Tempo variieren.", "min": 15, "blocks": [], "params": ["Wiederholungen: 15–20", "Klärungsweite: >15 m"], "tip": "⚡ Wenn die Richtung nicht kontrollierbar ist: hoch und weit — nie in die Mitte", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Luftduell mit Leichtem Kontakt", "d": "Der Erwachsene wirft und drückt mit einem Schild oder der Schulter leicht dagegen. Der Verteidiger muss die Position gewinnen, springen und klären. Wertung: saubere Klärung = 2, Berührung = 1.", "min": 18, "blocks": [], "params": ["Serien: 3 × 8", "Pause: 60 s"], "tip": "⚡ Den Raum VOR dem Sprung gewinnen — wer zuerst am Punkt ist, gewinnt", "warm": false}]}, {"t": "Erster Pass und Spielaufbau", "sub": "Offene Ballannahme, harter Kurzpass und langer Diagonalpass", "phase": 1, "obj": [["Ziele der Einheit", ["Nach vorne orientiert annehmen", "Harter, flacher Kurzpass", "Langer Diagonalpass über 30–40 m", "Beide Füsse einsetzen"]], ["Geforderte Verhaltensweisen", ["Vor der Annahme schauen (Scanning)", "Offene Körperstellung zum Feld", "Pass mit Absicht, nicht nur zur Sicherheit", "Nach dem Pass in Bewegung bleiben"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Passspiel mit dem Erwachsenen", "d": "Pässe mit 2 Kontakten auf 10 m, dann direkt. Annahme mit dem hinteren Fuss, Pass mit dem vorderen. Zum Schluss 10 leichte lange Pässe über 25 m.", "min": 15, "blocks": [], "params": ["Pässe: 3×2 min", "Lange: 10"], "tip": "⚡ Flach und hart — der Innenverteidiger ist der erste Spielmacher", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Annehmen und Aufdrehen im Dreieck", "d": "Hütchendreieck (8 m). Der Erwachsene passt; der Verteidiger nimmt orientiert zum angezeigten Hütchen an und dribbelt 3 Kontakte. Signal vor Ankunft des Balls.", "min": 12, "blocks": [], "params": ["Wiederholungen: 3×10", "Beide Füsse"], "tip": "⚡ Erster Kontakt in den Raum, nie hinter dich", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Langer Diagonalpass", "d": "Aus dem Zentrum spielt der Verteidiger diagonal in eine 5×5-m-Zone in 30–40 m (rechts und links). Flach-scharf oder hoch, je nach Ansage.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10 pro Fuss", "Ziel: Zone 5×5 m"], "tip": "⚡ Präzision vor Kraft — das Passgewicht entscheidet, ob der Mitspieler kontrolliert", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Pass unter Druck — 2 Sekunden", "d": "Der Erwachsene passt und presst sofort. Der Verteidiger hat 2 s, um auf eines von zwei Minitoren zu spielen (kurz in 10 m oder lang in 25 m). Der Erwachsene stellt eines zu.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×8", "Regel: max. 2 s"], "tip": "⚡ Sieh, welches Tor zugestellt wird, und spiel auf das andere", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Aufbau-Parcours", "d": "Ball vom 'Torhüter' (Erwachsener) annehmen → bis zur 15-m-Linie dribbeln → langer Pass in die Zone → im Sprint zurück in die Position. 6 Runden mit Zeitmessung.", "min": 18, "blocks": [], "params": ["Runden: 6", "Pause: 60 s"], "tip": "⚡ Am Ende, müde: bleibt die Qualität des langen Passes?", "warm": false}]}, {"t": "Lesen und Abfangen", "sub": "Die Passlinie antizipieren und abfangen, ohne Körperkontakt", "phase": 2, "obj": [["Ziele der Einheit", ["Die Körperhaltung des Passgebers lesen", "Zwischen Ball und Stürmer positionieren", "Im Moment des Passes starten", "Abfangen und mit Ball rausgehen"]], ["Geforderte Verhaltensweisen", ["Kopf in Bewegung: Ball – Gegner – Raum", "Seitlich stehen, startbereit", "Sich nicht zu früh festlegen", "Erster Kontakt nach dem Abfangen nach vorne"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Reaktion auf Signale", "d": "Kurze Läufe über 5 m in 4 Richtungen auf visuelles Signal des Erwachsenen (Arm/Hütchenfarbe). 3 Serien à 6 Reaktionen + 3 Antritte über 15 m.", "min": 15, "blocks": [], "params": ["Reaktionen: 3×6", "Antritte: 3×15 m"], "tip": "⚡ Reagiere auf das, was du siehst, nicht auf das, was du rätst", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Abfangen auf der Seite", "d": "Der Erwachsene passt zu einem Hütchen 15 m seitlich. Der Verteidiger startet 5 m neben der Passlinie und muss vor dem Ziel abfangen. Ausholzeit des Passes variieren.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12", "Pause: 20 s"], "tip": "⚡ Der Standfuss des Passgebers verrät, wohin der Ball geht", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Abfangen + Rausgehen", "d": "Wie zuvor, nach dem Abfangen 10 m Dribbling und Pass auf ein Minitor. Simuliert den Umschaltmoment.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Beide Seiten"], "tip": "⚡ Den Ball gewinnen ist die Hälfte — die andere Hälfte: ihn nicht sofort wieder verlieren", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Die Passfinte", "d": "Jedes dritte Mal täuscht der Erwachsene nur an. Der Verteidiger muss die Finte lesen und die Position halten, statt sich reinzuwerfen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 15", "Zählen: richtige Entscheidungen"], "tip": "⚡ Wer auf die Finte reinfällt, lässt die Tür offen", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Spiel: Pass oder Abfangen", "d": "Der Erwachsene versucht, abwechselnd 3 Zielhütchen anzuspielen. Der Verteidiger verteidigt die Zone. 1 Punkt pro Abfangen, der Erwachsene 1 Punkt pro angekommenem Pass. 3 Runden à 3 min.", "min": 18, "blocks": [], "params": ["Runden: 3×3 min", "Pause: 90 s"], "tip": "⚡ Punktestand notieren und nächstes Mal vergleichen", "warm": false}]}, {"t": "Abwehrlinie und Abseits", "sub": "Rausrücken, Fallenlassen und die Tiefe kontrollieren", "phase": 2, "obj": [["Ziele der Einheit", ["Erkennen, wann rausrücken (Ball unter Druck)", "Erkennen, wann fallen lassen (Ball frei)", "Den Raum hinter sich kontrollieren", "Im Sprint zum Tor zurück"]], ["Geforderte Verhaltensweisen", ["Rausrücken laut ansagen", "Beim Fallenlassen den Ball sehen", "Bei freiem Ball nie stehen bleiben", "Seitlich rückwärts laufen"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Rückwärts und Drehen", "d": "5 m rückwärts → 180°-Drehung → 10 m Sprint. Drehseite wechseln. 3×6 + dynamische Hüftmobilität.", "min": 15, "blocks": [], "params": ["Wdh.: 3×6", "Pause: 30 s"], "tip": "⚡ Zur Ballseite drehen — den Ball nie aus den Augen verlieren", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Ball unter Druck / Ball frei", "d": "Erwachsener mit Ball in 25 m: 'unter Druck' (mit dem Rücken) = 5 m rausrücken; 'frei' (Kopf oben) = 5 m fallen lassen. Hütchenlinie als Referenz.", "min": 12, "blocks": [], "params": ["Wiederholungen: 15 Signale", "Tempo: 80 %"], "tip": "⚡ Freier Ball = Gefahr im Rücken. Fallen lassen vor dem Pass, nicht danach", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Die Tiefe Verteidigen", "d": "Der Erwachsene spielt lang hinter den Verteidiger (Zone 15 m dahinter). Er läuft seitlich zurück, dreht und gewinnt den Ball vor einer Hütchenlinie. Optional mit Wettlauf des Erwachsenen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Pause: 30 s"], "tip": "⚡ Mit dem 1. Schritt diagonal nach hinten drehen — schneller als rückwärts", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Abseitsfalle Stellen", "d": "3 Hütchen = Abwehrlinie. Der Erwachsene 'spielt' auf Signal; der Verteidiger rückt im richtigen Moment raus, damit ein Stürmer-Hütchen im Abseits steht. Timing-Training.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12", "Analyse: Handyvideo"], "tip": "⚡ Zu spät rausrücken ist schlimmer als gar nicht — das Signal mit dem Team abstimmen", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Wiederholte Rückwärtssprints", "d": "Nach simuliertem Fehler (Ball im Rücken) 20 m Sprint zum Tor + Verteidigungsposition. 6 Wiederholungen mit 30 s Pause (Schnelligkeitsausdauer).", "min": 18, "blocks": [], "params": ["Serien: 2×6", "Pause zwischen Serien: 3 min"], "tip": "⚡ Innenverteidiger beschleunigen besonders oft beim defensiven Umschalten — trainiere für den härtesten Moment des Spiels", "warm": false}]}, {"t": "Luftduelle im Spiel", "sub": "Flanken aus verschiedenen Winkeln, den Ball attackieren und der zweite Ball", "phase": 2, "obj": [["Ziele der Einheit", ["Flanken aus verschiedenen Zonen verteidigen", "Wählen: raus köpfen oder zum Mitspieler", "Mit dem Körper die Position gewinnen", "Auf den zweiten Ball reagieren"]], ["Geforderte Verhaltensweisen", ["Position zwischen Tor und Stürmer", "Den Ball sehen und den Stürmer spüren", "Einbeinig springen, aktive Arme", "Nach dem Sprung bereit für den zweiten Ball"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Reaktive Sprünge", "d": "Niedersprünge (Kasten oder Stufe 30 cm) 3×5, seitliche Sprünge 3×8, 10 leichte Kopfbälle.", "min": 15, "blocks": [], "params": ["Plyometrie: 3×5 + 3×8", "Kopfbälle: 10"], "tip": "⚡ Wenig Umfang, maximale Qualität — schnell und hoch springen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Flanken aus 3 Zonen", "d": "Der Erwachsene flankt aus 3 Positionen (Seite, Halbfeld, frontal). Der Verteidiger stellt sich ein und klärt. Richtung vor der Flanke ansagen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6", "Ziel: aus dem Strafraum"], "tip": "⚡ Füsse vor dem Sprung einstellen — der Sprung beginnt mit den Schritten", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Kopfball in die Zielzone", "d": "Zwei seitliche Zielzonen (5×5 m). Der Verteidiger köpft in die vom Erwachsenen angesagte Zone. Richtungskontrolle mit der Stirn.", "min": 12, "blocks": [], "params": ["Wiederholungen: 3×8", "Punkte: richtige Zone"], "tip": "⚡ Gezielt klären ist schon der Beginn des Angriffs", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Erster und Zweiter Ball", "d": "Der Erwachsene wirft hoch; der Verteidiger klärt; sofort folgt ein flacher zweiter Ball an die Strafraumgrenze. Reagieren, kontrollieren oder klären.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Intensität: hoch"], "tip": "⚡ Die Aktion endet nicht mit dem Kopfball", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Wettkampfserie Luft", "d": "10 verschiedene hohe Bälle in 2 min. Saubere Klärungen zählen (>15 m, nach aussen). Ziel: Ergebnis aus Einheit 2 übertreffen.", "min": 18, "blocks": [], "params": ["Serien: 3", "Pause: 2 min"], "tip": "⚡ Im Tagebuch notieren: x/10 saubere Klärungen", "warm": false}]}, {"t": "Strafraum Verteidigen — Flache Flanken", "sub": "Position zu Tor, Ball und Stürmer; Klären und Blocken", "phase": 2, "obj": [["Ziele der Einheit", ["Am kurzen Pfosten/Zentrum positionieren", "Flache Flanken klären", "Schüsse blocken, ohne sich wegzudrehen", "Nach dem Klären die Position wiederfinden"]], ["Geforderte Verhaltensweisen", ["Ball und Stürmer im Dreieck sehen", "Ballnaher Fuss vorne", "Frontal mit dem Körper blocken", "Beim Blocken nicht die Augen schliessen"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Aktivierung Fussschnelligkeit", "d": "Schnelle Ballkontakte (Tic-Tac), kurze Schritte, 'Fast Feet' in der Hütchenleiter, 3 Antritte über 5 m.", "min": 15, "blocks": [], "params": ["Serien: 3×30 s", "Antritte: 3×5 m"], "tip": "⚡ Schnelle Füsse = saubere Klärungen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Klären am Kurzen Pfosten", "d": "Der Erwachsene flankt flach aus 20 m seitlich. Der Verteidiger attackiert den kurzen Pfosten und klärt nach aussen. Passtempo variieren.", "min": 12, "blocks": [], "params": ["Wiederholungen: 3×6", "Beide Seiten"], "tip": "⚡ Vor dem Stürmer am Ball sein: attackiere den Raum, warte nicht", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Zurückgelegter Ball", "d": "Flanke auf den Elfmeterpunkt. Der Verteidiger löst sich vom kurzen Pfosten, stellt sich ein und klärt oder blockt.", "min": 15, "blocks": [], "params": ["Wiederholungen: 12", "Pause: 20 s"], "tip": "⚡ Beim Zurücklaufen den Ball sehen — der Rückpass ist der gefährlichste Ball", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Schuss Blocken", "d": "Der Erwachsene schiesst aus 14–18 m mit halber Kraft; der Verteidiger läuft an und blockt seitlich mit geschlossenen Beinen, ohne sich wegzudrehen.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Schusskraft: steigernd"], "tip": "⚡ Arme hinter den Rücken, um Elfmeter zu vermeiden", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Strafraum Verteidigen — Gemischte Serie", "d": "Zufällige Abfolge: flach kurzer Pfosten, Rückpass, hoch, Schuss. 8 Bälle pro Serie. Gut gelöste Aktionen zählen.", "min": 18, "blocks": [], "params": ["Serien: 3 × 8", "Pause: 90 s"], "tip": "⚡ Bewerten: Bei wie vielen hat der Verteidiger die richtige Aktion gewählt?", "warm": false}]}, {"t": "Defensives Umschalten", "sub": "Auf Ballverlust reagieren, den Konter bremsen und Zeit gewinnen", "phase": 3, "obj": [["Ziele der Einheit", ["In unter 2 s auf Ballverlust reagieren", "Zurücklaufen und das Zentrum schliessen", "Den Stürmer verzögern", "1-gegen-1 im Tempo verteidigen"]], ["Geforderte Verhaltensweisen", ["Erste Reaktion: zurücklaufen, nicht reklamieren", "Kopf beim Zurücklaufen in Bewegung", "Zuerst das Zentrum schliessen", "Geduld im 1-gegen-1"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Umschaltläufe", "d": "Gehen → Signal → 15 m Sprint zurück → abbremsen → 5 m seitlich rückwärts. 3×5. Dynamische Mobilität.", "min": 15, "blocks": [], "params": ["Wdh.: 3×5", "Pause: 40 s"], "tip": "⚡ Das Umschalten wird in den ersten 3 Schritten gewonnen", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Konter 1-gegen-1 im Tempo", "d": "Der Erwachsene dribbelt von der Mittellinie mit hohem Tempo; der Verteidiger startet 5 m davor und muss bis zur Strafraumlinie verzögern.", "min": 15, "blocks": [], "params": ["Wiederholungen: 8", "Pause: 45 s"], "tip": "⚡ Verzögern ist schon gewinnen: Es gibt den Mitspielern Zeit", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Das Zentrum Schliessen", "d": "Drei Hütchenkorridore. Der Erwachsene greift durch die Mitte an; der Verteidiger muss ihn vor dem Strafraum in den Seitenkorridor drängen.", "min": 12, "blocks": [], "params": ["Wiederholungen: 10", "Punkte: nach aussen gedrängt"], "tip": "⚡ Das Zentrum ist die Autobahn zum Tor — schliesse sie", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Rückweg + Duell", "d": "20 m Sprint aus Angriffsposition → 1-gegen-1 an der Strafraumgrenze. Schnelligkeitsausdauer mit Entscheidung.", "min": 15, "blocks": [], "params": ["Wdh.: 2×5", "Pause zwischen Serien: 3 min"], "tip": "⚡ Auch müde die bessere Entscheidung treffen", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Spielszenario: Letzter Mann", "d": "5 Konterszenarien hintereinander (langer Ball, Dribbling, Pass in die Tiefe). Punkte pro gelöstem Szenario.", "min": 18, "blocks": [], "params": ["Szenarien: 3×5", "Pause: 2 min"], "tip": "⚡ Ergebnisse notieren — Ziel: 4 von 5", "warm": false}]}, {"t": "Offensiv: Standards und Andribbeln", "sub": "Offensiver Kopfball bei Ecken und Andribbeln, um Linien zu brechen", "phase": 3, "obj": [["Ziele der Einheit", ["Anlaufweg bei der Ecke", "Nach unten aufs Tor köpfen", "Andribbeln, um einen Gegner herauszulocken", "Vertikaler Pass durch eine Linie"]], ["Geforderte Verhaltensweisen", ["Lauf von aussen nach innen", "Den Ball am höchsten Punkt attackieren", "Mit erhobenem Kopf dribbeln", "Passen, sobald der Gegner herauskommt"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Offensive Aktivierung", "d": "Dribblings mit Tempowechsel (3×20 m), 5 einbeinige Sprünge mit Anlauf, 8 Kopfbälle aufs Tor aus 6 m.", "min": 15, "blocks": [], "params": ["Dribblings: 3×20 m", "Kopfbälle: 8"], "tip": "⚡ Die Explosivität für die Offensive aktivieren", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Ecke — Anlauf und Kopfball", "d": "Der Erwachsene flankt von der Ecke (Fuss oder Hand). Der Verteidiger läuft im Bogen von aussen nach innen und köpft nach unten. Kurzer und langer Pfosten im Wechsel.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×6", "Ziel: untere Ecke"], "tip": "⚡ Auf den Boden köpfen — der schwierigste Ball für den Torhüter", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Andribbeln, um Herauszulocken", "d": "Der Verteidiger dribbelt auf ein Gegner-Hütchen (oder den Erwachsenen) zu. Sobald der Erwachsene herauskommt, Pass auf das freie Minitor vorne.", "min": 12, "blocks": [], "params": ["Wiederholungen: 10", "Distanz: 25 m"], "tip": "⚡ Andribbeln ist keine Zeitverschwendung: Es zwingt jemanden herauszukommen", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Vertikaler Pass Zwischen die Linien", "d": "Der Verteidiger nimmt an und spielt zwischen zwei Hütchen (Mittelfeldlinie) in eine Zone in 20 m. Der Erwachsene stellt eine Lücke zu.", "min": 15, "blocks": [], "params": ["Wiederholungen: 3×8", "Regel: 2 Kontakte"], "tip": "⚡ Ein guter vertikaler Pass überspielt eine ganze Linie", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Offensiv-Parcours des Innenverteidigers", "d": "Annehmen → 15 m andribbeln → vertikaler Pass → zurück in Position → Ecke (köpfen). 6 Runden.", "min": 18, "blocks": [], "params": ["Runden: 6", "Pause: 75 s"], "tip": "⚡ Moderne Innenverteidiger sind der erste Angreifer — nicht nur der letzte Verteidiger", "warm": false}]}, {"t": "Gesamtintegration Innenverteidiger", "sub": "Testeinheit mit allen Bausteinen im Spiel", "phase": 3, "obj": [["Ziele der Einheit", ["1-gegen-1, Luftspiel und Passspiel verbinden", "Qualität unter Ermüdung halten", "In jedem Szenario richtig entscheiden", "Mit den früheren Einheiten vergleichen"]], ["Geforderte Verhaltensweisen", ["Ständige Kommunikation", "Konzentration von der ersten bis zur letzten Minute", "Seitlich stehen, aktive Füsse", "Technische Qualität auch müde"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Vollständiges Aufwärmen", "d": "Füsse, Rückwärtslaufen, Sprünge, kurze und lange Pässe. Intensität bis 90 % steigern.", "min": 15, "blocks": [], "params": ["Dauer: 15 min", "Endintensität: 90 %"], "tip": "⚡ Heute ist Testtag: aufwärmen wie vor einem Spiel", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Test: Defensives 1-gegen-1", "d": "10 Duelle gegen den Erwachsenen auf die Minitore. Siege notieren.", "min": 12, "blocks": [], "params": ["Duelle: 10", "Notieren: x/10"], "tip": "⚡ Mit Einheit 1 vergleichen", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Test: Luftspiel", "d": "10 verschiedene hohe Bälle. Saubere Klärungen notieren.", "min": 12, "blocks": [], "params": ["Bälle: 10", "Notieren: x/10"], "tip": "⚡ Mit Einheit 6 vergleichen", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Test: Langer Pass", "d": "10 lange Diagonalpässe (5 pro Fuss) in eine 5×5-m-Zone in 35 m.", "min": 12, "blocks": [], "params": ["Pässe: 10", "Notieren: x/10"], "tip": "⚡ Mit Einheit 3 vergleichen", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Finaler Parcours mit Zeitmessung", "d": "Abfangen → Andribbeln → langer Pass → Rückwärtslauf → 1-gegen-1 → Kopfball. 4 Runden mit Zeitmessung.", "min": 24, "blocks": [], "params": ["Runden: 4", "Pause: 2 min"], "tip": "⚡ Ergebnisse am Ende über den Button an den Trainer senden", "warm": false}]}], "lat": [{"t": "Die Seite Verteidigen 1-gegen-1", "sub": "Haltung, Abstand und den Flügelspieler im Korridor stoppen", "phase": 1, "obj": [["Ziele der Einheit", ["Die Linie schliessen und nach innen oder aussen lenken (je nach Plan)", "Den richtigen Abstand zum Flügelspieler halten", "Nicht im Tempo überlaufen werden", "Ohne Foul den Ball erobern"]], ["Geforderte Verhaltensweisen", ["Tief und seitlich stehen", "Kurze Schritte beim Anlaufen", "Auf den Ball schauen, nicht auf die Finten", "Sofort nachsetzen, wenn du überlaufen wirst"]]], "ex": [{"sec": "Aufwärmen", "id": "A1", "n": "Seitliche Aktivierung", "d": "Sidesteps, Überkreuzschritte und Rückwärtslaufen in einem 15-m-Korridor; 4 Antritte über 20 m entlang der Linie.", "min": 15, "blocks": [], "params": ["Serien: 3", "Antritte: 4×20 m"], "tip": "⚡ Der Aussenverteidiger sprintet zu den meisten im Spiel — die Oberschenkelrückseite gut vorbereiten", "warm": true}, {"sec": "Hauptteil", "id": "P1", "n": "Kontrolliertes Anlaufen", "d": "Der Erwachsene nimmt in 15 m stehend an. Der Aussenverteidiger läuft schnell an und bremst auf den letzten 3 m mit kurzen Schritten ab, seitlich stehend.", "min": 12, "blocks": [], "params": ["Wiederholungen: 12", "Tempo: 80 %"], "tip": "⚡ Schnell auf der langen Distanz, kurz und kontrolliert am Ende", "warm": false}, {"sec": "Hauptteil", "id": "P2", "n": "Korridor 5×20 m", "d": "Hütchenkorridor. Der Erwachsene will zur Grundlinie; der Aussenverteidiger verhindert es. Ohne Foul, nur mit Positionierung und Tackling beim weiten Kontakt.", "min": 15, "blocks": [], "params": ["Duelle: 3×6", "Pause: 45 s"], "tip": "⚡ Wenn du den Ball nicht gewinnst, dräng ihn zurück", "warm": false}, {"sec": "Hauptteil", "id": "P3", "n": "Nachsetzen nach Überlaufen", "d": "Der Erwachsene legt sich den Ball am Aussenverteidiger vorbei und startet. Dieser dreht und sprintet zurück, um vor der Linie zu klären.", "min": 15, "blocks": [], "params": ["Wiederholungen: 10", "Pause: 30 s"], "tip": "⚡ Zur Ballseite drehen und gerade zum Abfangpunkt sprinten", "warm": false}, {"sec": "Abschluss", "id": "F1", "n": "Duelle mit Zählung", "d": "8 Duelle 1-gegen-1 im Korridor. Punkt pro Balleroberung oder gestopptem Erwachsenen. Notieren.", "min": 18, "blocks": [], "params": ["Serien: 2×8", "Pause: 2 min"], "tip": "⚡ Ziel für Einheit 10: diese Zahl verbessern", "warm": false}]}, {"t": "Hinterlaufen und Flanken", "sub": "Timing des Laufs, Annahme im Tempo und Flanken in 3 Zonen", "phase": 1, "obj": [["Ziele der Einheit", ["Den Moment für das Hinterlaufen wählen", "Im Tempo annehmen, ohne abzubremsen", "Auf kurzen Pfosten, Mitte und langen Pfosten flanken", "Flache, sc  ['Wie funktioniert Premium?','CHF 49 für 6 Monate (eine Halbsaison), einmalige Zahlung, kein Abo. Nach der Zahlung erhältst du einen Code per WhatsApp und aktivierst ihn auf der Premium-Seite.','premium bezahlen preis code kaufen freischalten kosten'],
 ['Neues Handy, Fortschritt weg.','Die Daten werden auf dem Gerät im Browser gespeichert. Browserdaten nicht löschen. Auf einem neuen Gerät den Code erneut aktivieren.','fortschritt weg handy neues geraet daten geloescht']]},
en:{tile:['Ask Felipe','Questions answered'],small:'Questions',title:'Ask Felipe',ph:'Type your question…',hint:'Type your question: we show matching answers straight away. If that is not enough, send it to Felipe.',found:'This might help:',none:'No ready answer for this yet.',send:'📲 Send the question to Felipe',faqT:'Frequent questions',histT:'My sent questions',note:'Felipe replies on WhatsApp. If there is pain or injury, see a doctor or physio first.',msg:(n,p,l,s,q)=>`❓ Question · FLP App\n👤 ${n||'—'} · ${p} · ${l}${s?'\n📅 '+s:''}\n\n${q}`,lvJ:'Youth',lvP:'Pro 17+',
 faq:[
 ['How often per week should I train?','2 guided sessions per week (A and B) on top of club training. At least 1 day between hard sessions, and not the day before a match.','how often week frequency days per week train'],
 ['I am in pain. Can I train?','No. Stop and do not train through pain. See a doctor or physio. The app does not replace medical care.','pain hurts injury injured knee ankle sore'],
 ['Can I train the day before a match?','Only a light activation (15–20 min, without getting tired) or rest. Hard sessions 2–4 days before the match.','before match day before tomorrow game'],
 ['I have no cones or equipment.','Bottles, bags or shoes work as cones. A wall is your passing partner. One ball is enough to start.','equipment cones no bottle wall ball without'],
 ['How long is a session?','About 50–60 min, including warm-up and keepy-ups. Short on time? Do half today and the rest tomorrow.','how long duration minutes'],
 ['My child is losing motivation.','Short sessions with challenges: beat the keepy-up record, count hits. Praise effort, not just results. Let them pick a favourite drill.','motivation bored boring child son daughter'],
 ['The drill is too hard/too easy.','Use "Progress when": only step up once the target is reached. Every drill has a youth version for younger players.','hard easy too level progression'],
 ['From what age can it be used?','From 8–9 years with an adult guiding. Every drill has an adaptation for younger players. Pro level is 17+.','age years child minimum young'],
 ['Can I change position?','Yes, at the start of the app. Progress is saved per position.','change position switch other'],
 ['What should I eat before training or a match?','A normal meal 2–3 h before; if needed a light snack 60 min before (banana, bread). Drink water through the day. See Nutrition.','eat food nutrition before training match snack water drink'],
 ['How does Premium work?','CHF 49 for 6 months (half a season), one-time payment, no subscription. After paying you get a code on WhatsApp and activate it on the Premium page.','premium pay price code buy unlock cost'],
 ['New phone, progress gone.','Data is stored on the device in the browser. Do not clear browser data. On a new device, activate your code again.','progress lost phone new device data deleted']]}};
const qaNorm=x=>x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ');
function qaFind(q){const w=qaNorm(q).split(' ').filter(x=>x.length>2);if(!w.length)return [];
 return QA[lang].faq.map(f=>{const hay=qaNorm(f[0]+' '+f[2]);return [w.filter(x=>hay.includes(x)).length,f]}).filter(r=>r[0]>0).sort((a,b)=>b[0]-a[0]).filter((r,i,A)=>r[0]>=Math.min(2,A[0][0])).slice(0,3).map(r=>r[1])}
function qaMsg(q){const Q=QA[lang],n=nextSess&&nextSess();let s='';try{if(n)s=sessLabel(n.w,n.s)+' · '+sessName(n.w,n.s)}catch(e){}
 return Q.msg(store.get('name',''),P().nome,level==='pro'?Q.lvP:Q.lvJ,s,q)}
function drawQA(){const Q=QA[lang],el=$('qa-body');$('qa-small').textContent='FLP · '+Q.small;$('qa-title').textContent=Q.title;const hist=store.get('qaHist',[]);
 el.innerHTML=`<div class="card"><p class="sub" style="margin:0 0 10px">${Q.hint}</p>
  <input type="text" id="qa-name" placeholder="${T().namePh}" value="${esc(store.get('name',''))}" style="margin-bottom:8px">
  <textarea id="qa-q" rows="3" placeholder="${Q.ph}" style="width:100%;box-sizing:border-box;background:var(--card2);color:inherit;border:1px solid var(--line,#2a2a2a);border-radius:12px;padding:12px;font:inherit;resize:vertical"></textarea>
  <div id="qa-res"></div>
  <a class="btn" id="qa-send" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;background:#25D366;color:#0b2e17;margin-top:10px">${Q.send}</a>
  <p class="note" style="margin:10px 0 0">ℹ️ ${Q.note}</p></div>
  <div class="sec">${Q.faqT}</div>${Q.faq.map(f=>`<details class="acc"><summary>${esc(f[0])}</summary><div class="bd">${esc(f[1])}</div></details>`).join('')}
  ${hist.length?`<div class="sec">${Q.histT}</div><div class="card">${hist.slice(-5).reverse().map(h=>`<p style="font-size:13px;margin:0 0 8px"><span class="mono" style="color:var(--gold)">${new Date(h.d).toLocaleDateString()}</span> · ${esc(h.q)}</p>`).join('')}</div>`:''}`;
 const qi=$('qa-q'),send=$('qa-send');
 const upd=()=>{const q=qi.value.trim(),r=q.length>2?qaFind(q):[];
  $('qa-res').innerHTML=q.length>2?(r.length?`<label class="l" style="margin-top:12px">${Q.found}</label>${r.map(f=>`<div style="background:rgba(201,168,76,.10);border-radius:10px;padding:10px 12px;margin-bottom:6px"><b style="font-size:14px">${esc(f[0])}</b><p style="font-size:13px;color:#d9d6ce;margin:4px 0 0;line-height:1.45">${esc(f[1])}</p></div>`).join('')}`:`<p class="note" style="margin:10px 0 0">${Q.none}</p>`):'';
  send.href=waLink(qaMsg(q||'…'));send.style.opacity=q.length>2?1:.5;send.style.pointerEvents=q.length>2?'auto':'none'};
 qi.oninput=upd;$('qa-name').oninput=()=>{store.set('name',$('qa-name').value.trim());upd()};
 send.onclick=()=>{const q=qi.value.trim();if(q.length>2){const h=store.get('qaHist',[]);h.push({d:Date.now(),q});store.set('qaHist',h.slice(-20))}};upd()}

de:{links:'Impressum · Datenschutz · AGB',small:'Rechtliches',tabs:['Impressum','Datenschutz','AGB'],
imp:()=>`<p><b>${LGI.brand}</b><br>Inhaber: ${LGI.name} (Einzelunternehmen)<br>${LGI.addr}</p><p>E-Mail: ${LGI.mail}<br>Telefon/WhatsApp: ${LGI.tel}</p><p>Verantwortlich für den Inhalt: ${LGI.name}</p><p class="note">Die Inhalte dieser App ersetzen keine ärztliche oder physiotherapeutische Beratung.</p>`,
ds:()=>`<p><b>1. Verantwortlicher</b><br>${LGI.name}, ${LGI.brand}, ${LGI.addr.replace('<br>',', ')} · ${LGI.mail}</p>
<p><b>2. Keine Registrierung, Daten auf deinem Gerät</b><br>Die App braucht kein Konto. Deine Eingaben (Position, Name, Spielerprofil mit Alter, Grösse und Gewicht, Antworten, Trainings, Tests, Tagebuch, Fragen) werden nur lokal im Browser deines Geräts gespeichert (localStorage). Wir erhalten diese Daten nicht. Du kannst sie jederzeit löschen, indem du die Browserdaten löschst.</p>
<p><b>3. WhatsApp</b><br>Wenn du einen Bericht, ein Training oder eine Frage an den Trainer sendest, öffnet sich WhatsApp mit einer vorbereiteten Nachricht. Gesendet wird nur, was du selbst abschickst. Dabei gelten die Datenschutzbestimmungen von WhatsApp (Meta).</p>
<p><b>4. Zahlung</b><br>Die Zahlung läuft über einen externen Zahlungsanbieter (z.&nbsp;B. Stripe). Zahlungsdaten werden direkt dort verarbeitet; wir erhalten nur Name, E-Mail und Bestätigung der Zahlung, um dir den Code zu senden.</p>
<p><b>5. Hosting und Schriften</b><br>Die App wird bei einem Hosting-Anbieter (z.&nbsp;B. Netlify) betrieben, der technisch notwendige Server-Protokolle (z.&nbsp;B. IP-Adresse) speichert. Schriften werden von Google Fonts geladen; dabei wird deine IP-Adresse an Google übermittelt. Daten können dabei auch in die USA übertragen werden.</p>
<p><b>6. Kinder und Jugendliche</b><br>Bei Personen unter 16 Jahren sollen Eltern oder Erziehungsberechtigte die App gemeinsam mit dem Kind nutzen.</p>
<p><b>7. Deine Rechte</b><br>Du hast das Recht auf Auskunft, Berichtigung und Löschung deiner Daten (Schweizer Datenschutzgesetz, DSG). Kontakt: ${LGI.mail}</p><p class="note">Stand: ${LGI.upd}</p>`,
agb:()=>`<p><b>1. Anbieter</b><br>${LGI.brand}, ${LGI.name}, ${LGI.addr.replace('<br>',', ')}.</p>
<p><b>2. Produkt</b><br>FLP Premium schaltet alle Inhalte der App frei (geführte Trainings, Pro-Level, Bewertungen, Tests, Berichte). Es handelt sich um digitale Inhalte.</p>
<p><b>3. Preis und Laufzeit</b><br>CHF 49 für 6 Monate, einmalige Zahlung, kein Abo. Der Zugang gilt 6 Monate ab Aktivierung des Codes und endet danach automatisch, ohne Kündigung. Eine Verlängerung ist mit einem neuen Code möglich.</p>
<p><b>4. Kostenloser Test</b><br>Die App kann 7 Tage mit eingeschränktem Umfang kostenlos getestet werden.</p>
<p><b>5. Lieferung</b><br>Nach Zahlungseingang erhältst du deinen persönlichen Code per WhatsApp oder E-Mail, in der Regel innerhalb von 24 Stunden (Werktage). Ein Code gilt für einen Spieler bzw. eine Familie und darf nicht weitergegeben oder verkauft werden.</p>
<p><b>6. Widerruf</b><br>Mit der Zustellung des Codes wird der digitale Inhalt sofort bereitgestellt. Kunden aus der EU stimmen mit dem Kauf ausdrücklich zu, dass die Ausführung vor Ablauf der Widerrufsfrist beginnt, und nehmen zur Kenntnis, dass sie dadurch ihr Widerrufsrecht verlieren. Bei technischen Problemen finden wir gemeinsam eine Lösung.</p>
<p><b>7. Gesundheit und Haftung</b><br>Das Training erfolgt auf eigene Verantwortung. Bei Schmerzen, Verletzungen oder gesundheitlichen Problemen vorher ärztlichen Rat einholen. Minderjährige trainieren unter Aufsicht eines Erwachsenen. Die Inhalte ersetzen keine medizinische Beratung. Die Haftung ist im gesetzlich zulässigen Rahmen auf Vorsatz und grobe Fahrlässigkeit beschränkt.</p>
<p><b>8. Daten auf dem Gerät</b><br>Fortschritte werden lokal gespeichert. Für Datenverlust durch Löschen der Browserdaten oder Gerätewechsel wird keine Haftung übernommen.</p>
<p><b>9. Änderungen der Inhalte</b><br>Die App wird laufend verbessert. Inhalte können ergänzt oder angepasst werden.</p>
<p><b>10. Recht und Gerichtsstand</b><br>Es gilt Schweizer Recht. Gerichtsstand ist der Sitz des Anbieters; zwingende Gerichtsstände für Konsumenten bleiben vorbehalten.</p><p class="note">Stand: ${LGI.upd}</p>`},
pt:{links:'Aviso legal · Privacidade · Condições',small:'Informação legal',tabs:['Aviso legal','Privacidade','Condições'],
imp:()=>`<p><b>${LGI.brand}</b><br>Titular: ${LGI.name} (empresário em nome individual)<br>${LGI.addr}</p><p>E-mail: ${LGI.mail}<br>Telefone/WhatsApp: ${LGI.tel}</p><p>Responsável pelo conteúdo: ${LGI.name}</p><p class="note">Os conteúdos desta app não substituem aconselhamento médico ou de fisioterapia. Versão juridicamente vinculativa: alemão.</p>`,
ds:()=>`<p><b>1. Responsável</b><br>${LGI.name}, ${LGI.brand}, ${LGI.addr.replace('<br>',', ')} · ${LGI.mail}</p>
<p><b>2. Sem registo, dados no teu aparelho</b><br>A app não precisa de conta. O que introduzes (posição, nome, perfil com idade, altura e peso, respostas, treinos, testes, diário, perguntas) fica guardado só no navegador do teu aparelho (localStorage). Nós não recebemos esses dados. Podes apagá-los a qualquer momento apagando os dados do navegador.</p>
<p><b>3. WhatsApp</b><br>Quando envias um relatório, um treino ou uma pergunta ao treinador, abre-se o WhatsApp com uma mensagem preparada. Só é enviado o que tu próprio enviares. Aplicam-se as regras de privacidade do WhatsApp (Meta).</p>
<p><b>4. Pagamento</b><br>O pagamento é feito por um serviço externo (por ex. Stripe), que trata diretamente os dados de pagamento. Nós só recebemos nome, e-mail e a confirmação, para te enviar o código.</p>
<p><b>5. Alojamento e tipos de letra</b><br>A app está alojada num serviço externo (por ex. Netlify), que guarda registos técnicos necessários (por ex. endereço IP). Os tipos de letra vêm do Google Fonts, que recebe o teu endereço IP. Os dados podem ser transferidos para os EUA.</p>
<p><b>6. Crianças e jovens</b><br>Abaixo dos 16 anos, os pais ou responsáveis devem usar a app em conjunto com a criança.</p>
<p><b>7. Os teus direitos</b><br>Tens direito de acesso, retificação e eliminação dos teus dados (lei suíça de proteção de dados, DSG). Contacto: ${LGI.mail}</p><p class="note">Atualizado: ${LGI.upd}</p>`,
agb:()=>`<p><b>1. Vendedor</b><br>${LGI.brand}, ${LGI.name}, ${LGI.addr.replace('<br>',', ')}.</p>
<p><b>2. Produto</b><br>O FLP Premium desbloqueia todos os conteúdos da app (treinos guiados, nível Pro, avaliações, testes, relatórios). Trata-se de conteúdo digital.</p>
<p><b>3. Preço e duração</b><br>CHF 49 por 6 meses, pagamento único, sem mensalidade. O acesso vale 6 meses a partir da ativação do código e termina automaticamente, sem necessidade de cancelamento. Pode ser renovado com um novo código.</p>
<p><b>4. Teste grátis</b><br>A app pode ser testada grátis durante 7 dias, com funções limitadas.</p>
<p><b>5. Entrega</b><br>Depois do pagamento recebes o teu código pessoal por WhatsApp ou e-mail, normalmente em 24 horas (dias úteis). Um código vale para um atleta ou uma família e não pode ser partilhado nem revendido.</p>
<p><b>6. Desistência</b><br>Com a entrega do código, o conteúdo digital fica disponível de imediato. Clientes da UE aceitam, com a compra, que a execução comece antes do fim do prazo de desistência e perdem assim esse direito. Em caso de problemas técnicos, encontramos uma solução em conjunto.</p>
<p><b>7. Saúde e responsabilidade</b><br>O treino é feito por conta e risco próprios. Em caso de dor, lesão ou problemas de saúde, consulta primeiro um médico. Menores treinam com a supervisão de um adulto. Os conteúdos não substituem aconselhamento médico. A responsabilidade limita-se, no permitido por lei, a dolo e negligência grave.</p>
<p><b>8. Dados no aparelho</b><br>O progresso fica guardado no aparelho. Não nos responsabilizamos pela perda de dados ao apagar o navegador ou trocar de aparelho.</p>
<p><b>9. Alterações</b><br>A app é melhorada continuamente; os conteúdos podem ser acrescentados ou ajustados.</p>
<p><b>10. Lei aplicável</b><br>Aplica-se a lei suíça. Foro: sede do vendedor, salvo foros obrigatórios para consumidores.</p><p class="note">Atualizado: ${LGI.upd} · Versão juridicamente vinculativa: alemão.</p>`}};

function dgSVG(k,n){const d=DG[k]&&DG[k][n];if(!d)return '';const W=100,H=70,o=[];
 o.push(`<rect width="${W}" height="${H}" fill="#10251a"/>`);
 const ln='stroke="rgba(255,255,255,.28)" stroke-width=".4" fill="none"';
 if(d.g){o.push(`<line x1="0" y1="1" x2="100" y2="1" ${ln}/><rect x="22" y="1" width="56" height="26" ${ln}/><rect x="38" y="1" width="24" height="9" ${ln}/><path d="M42 27 A10 10 0 0 0 58 27" ${ln}/><rect x="44" y="-1.5" width="12" height="2.5" fill="none" stroke="#fff" stroke-width=".6"/>`)}
 else o.push(`<line x1="0" y1="69" x2="100" y2="69" ${ln}/><circle cx="50" cy="69" r="9" ${ln}/>`);
 const col={pass:'#ffffff',run:'#D4B254',shot:'#4FC3B0'};
 (d.ar||[]).forEach(([t,x1,y1,x2,y2,c])=>{const mx=(x1+x2)/2+(c?(y2-y1)*.35:0),my=(y1+y2)/2+(c?-(x2-x1)*.35:0);
  o.push(`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="${col[t]}" stroke-width="${t==='run'?.8:.6}" fill="none" ${t==='run'?'':'stroke-dasharray="1.6 1.2"'} marker-end="url(#ah-${t})"/>`)});
 (d.l||[]).forEach(([a,b,c,e])=>o.push(`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="rgba(255,255,255,.35)" stroke-width=".3" stroke-dasharray=".6 .8"/>`));
 (d.t||[]).forEach(([x,y,v])=>o.push(`<text x="${x}" y="${y}" font-size="2.8" text-anchor="middle" fill="rgba(255,255,255,.7)" font-family="Inter" font-weight="600">${v}</text>`));
 (d.x||[]).forEach(([x,y])=>o.push(`<path d="M${x-2} ${y-2}L${x+2} ${y+2}M${x+2} ${y-2}L${x-2} ${y+2}" stroke="#F08A6C" stroke-width=".8"/>`));
 (d.it||[]).forEach(([t,x,y])=>{
  if(t==='P')o.push(`<circle cx="${x}" cy="${y}" r="2.6" fill="#D4B254"/><text x="${x}" y="${y+1.1}" font-size="3" text-anchor="middle" fill="#000" font-family="Inter" font-weight="700">A</text>`);
  else if(t==='D')o.push(`<circle cx="${x}" cy="${y}" r="2.6" fill="none" stroke="#fff" stroke-width=".6"/><text x="${x}" y="${y+1.1}" font-size="3" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="700">T</text>`);
  else if(t==='c')o.push(`<path d="M${x} ${y-1.8}L${x+1.5} ${y+1}L${x-1.5} ${y+1}Z" fill="#F08A6C"/>`);
  else if(t==='m')o.push(`<rect x="${x-1.2}" y="${y-2.6}" width="2.4" height="5.2" rx=".6" fill="#7d7d7d"/>`);
  else if(t==='b')o.push(`<circle cx="${x}" cy="${y}" r="1.1" fill="#fff" stroke="#000" stroke-width=".25"/>`)});
 const mk=t=>`<marker id="ah-${t}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6Z" fill="${col[t]}"/></marker>`;
 return `<svg viewBox="0 -2 100 72" style="width:100%;display:block;margin:4px 0 12px;border:1px solid var(--line)"><defs>${mk('pass')+mk('run')+mk('shot')}</defs>${o.join('')}</svg>`}

function drawPerfil(){const L=PF[lang]||PF.pt,p=pfGet();$('pf-small').textContent=L.small;$('pf-title').textContent=L.title;
 const chips=(k,arr)=>`<div class="seg" style="margin-bottom:14px">${arr.map((x,i)=>`<button type="button" class="${String(p[k])===String(i)?'on':''}" data-pf="${k}" data-v="${i}">${x}</button>`).join('')}</div>`;
 const inp=(k,lab,type,ph)=>`<label class="l">${lab}</label><input type="${type}" id="pf-${k}" value="${esc(p[k]==null?'':String(p[k]))}" ${ph?`placeholder="${esc(ph)}"`:''} ${type==='number'?'inputmode="numeric"':''} style="margin-bottom:12px">`;
 $('pf-body').innerHTML=`<div class="card"><p class="sub" style="margin:0 0 14px">${L.intro}</p>${inp('name',L.name,'text')}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>${inp('age',L.age,'number')}</div><div>${inp('h',L.h,'number')}</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div>${inp('w',L.w,'number')}</div><div>${inp('cat',L.cat.split(' (')[0],'text','U15')}</div></div>${inp('team',L.team,'text')}<label class="l">${L.foot}</label>${chips('foot',L.feet)}<label class="l">${L.plan}</label>${chips('plan',L.plans)}${inp('goal',L.goal,'text',L.goalPh)}<p class="ref" style="margin:0 0 12px">${L.minor}</p><button class="btn" id="pf-save">${L.save}</button><p class="msg" id="pf-msg" style="text-align:center"></p><a class="btn" id="pf-wa" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;background:#25D366;color:#0b2e17;margin-top:10px">${L.send}</a></div>`;
 const read=()=>{const q={};['name','age','team','cat','h','w','goal'].forEach(k=>q[k]=$('pf-'+k).value.trim());document.querySelectorAll('#pf-body .seg button.on').forEach(b=>q[b.dataset.pf]=+b.dataset.v);return q};
 const persist=()=>{const q=read();store.set('profile',q);if(q.name)store.set('name',q.name);if(q.w||q.age){store.set('nutri',{p:+q.w||'',id:+q.age||''});try{$('n-peso').value=q.w;$('n-idade').value=q.age}catch(e){}}$('pf-wa').href=waLink(pfMsg(q));return q};
 document.querySelectorAll('#pf-body [data-pf]').forEach(b=>b.onclick=()=>{document.querySelectorAll(`#pf-body [data-pf=${b.dataset.pf}]`).forEach(x=>x.classList.remove('on'));b.classList.add('on');persist()});
 document.querySelectorAll('#pf-body input').forEach(i=>i.oninput=persist);
 $('pf-save').onclick=()=>{persist();$('pf-msg').style.color='var(--ok)';$('pf-msg').textContent=L.saved};
 $('pf-wa').onclick=()=>persist();$('pf-wa').href=waLink(pfMsg(p));}

let deferredInstall=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;try{if(document.getElementById('ins-pick'))drawPicker()}catch(_){}});
function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}
function installCard(){if(isStandalone()||store.get('insOff',false))return '';const L=INS[lang]||INS.pt,ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return `<div class="banner" id="ins-card" style="margin-bottom:14px;display:block;border-color:#3a3220"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--gold)">📲 ${L.t}</b><span id="ins-x" style="cursor:pointer;color:var(--mut);padding:0 4px">✕</span></div><p style="font-size:13px;line-height:1.5;margin:6px 0 0;color:#ddd">${ios?L.ios:L.and}</p>${deferredInstall?`<button class="btn" id="ins-go" style="margin-top:10px">${L.btn}</button>`:''}</div>`}
function bindInstall(){const x=document.getElementById('ins-x');if(x)x.onclick=e=>{e.stopPropagation();store.set('insOff',true);const c=document.getElementById('ins-card');if(c)c.remove()};
 const g=document.getElementById('ins-go');if(g)g.onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(_){}deferredInstall=null;const c=document.getElementById('ins-card');if(c)c.remove()}}
