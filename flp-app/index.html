  <input type="range" id="fb-r" min="1" max="10" value="${fb.r}" style="width:100%;accent-color:#C9A84C;margin:6px 0 14px">
  <textarea id="fb-n" rows="2" placeholder="${t.fbNote}" style="margin-bottom:10px">${esc(fb.n)}</textarea>
  <input type="text" id="fb-name" placeholder="${t.namePh}" value="${esc(store.get('name',''))}" style="margin-bottom:12px">
  <a class="btn" id="fb-send" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;background:#25D366;color:#0b2e17">${t.fbSend}</a>
  <button class="btn ghost" id="fb-save" style="margin-top:10px">${t.fbSave}</button><p class="msg" id="fb-msg"></p></div>`;
 const upd=()=>{saveFb();$('fb-send').href=waLink(sessMsg())};
 el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{fb.q=+b.dataset.q;el.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',+x.dataset.q<=fb.q));$('fb-ql').textContent=t.fbQl[fb.q];upd()});
 $('fb-r').oninput=()=>{fb.r=+$('fb-r').value;$('fb-rv').textContent=fb.r;$('fb-rl').textContent=t.rpe[fb.r];upd()};
 $('fb-n').oninput=()=>{fb.n=$('fb-n').value.trim();upd()};
 $('fb-name').oninput=()=>{store.set('name',$('fb-name').value.trim());upd()};
 $('fb-save').onclick=()=>{saveFb();$('fb-msg').style.color='var(--ok)';$('fb-msg').textContent=t.fbSaved};
 $('fb-send').onclick=()=>{saveFb();$('fb-msg').style.color='var(--ok)';$('fb-msg').textContent=t.fbSaved};
 upd();}
function setEx(i){clearInterval(tm);tm=null;ei=Math.max(0,Math.min(L.length-1,i));ph='ready';left=tot=L[ei].w;fb=null;drawFb();drawT()}
$('t-play').onclick=()=>{if(!sess)return;if(tm){clearInterval(tm);tm=null;drawT();return}
 beep(0.01);if(ph==='done')setEx(0);if(ph==='ready')ph='work';tm=setInterval(tick,1000);drawT()};
$('t-prev').onclick=()=>setEx(ei-1);$('t-next').onclick=()=>setEx(ei+1);

// =============== TESTES FÍSICOS ===============
function drawTests(){const t=T(),data=store.get('tests',{}),bk=bandKey(age()),band=t.ageBand(age());
 $('ts-body').innerHTML=Object.keys(t.tests).map(k=>{const [nm,un,how]=t.tests[k],R=REF[k],arr=data[k]||[];
  const best=arr.length?(R.lower?Math.min(...arr.map(x=>x.v)):Math.max(...arr.map(x=>x.v))):null;
  const rb=R[bk];
  return `<div class="card"><label class="l">${nm}</label><p class="ref" style="margin:0 0 10px">${how}</p>
  <div class="row"><input type="number" step="0.01" id="ts-${k}" placeholder="${un}" style="flex:1"><button class="btn" style="width:auto;padding:0 18px" data-ts="${k}">${t.tsSave}</button></div>
  ${arr.length?`<div class="list" style="margin-top:10px">${arr.slice(-4).reverse().map(x=>`<div class="it"><span style="color:var(--mut)">${fdate(x.d)}</span><b>${x.v} ${un}</b></div>`).join('')}</div><p style="margin-top:8px;font-size:13px">${t.tsBest}: <b style="color:var(--gold)">${best} ${un}</b>${arr.length>1?(()=>{const d=+(arr[arr.length-1].v-arr[0].v).toFixed(2),good=R.lower?d<0:d>0;return ` · ${t.tsChange}: <b style="color:${d===0?'var(--mut)':good?'var(--ok)':'#E58A6E'}">${d>0?'+':''}${d} ${un}</b>`})():''}</p>`:`<p class="ref">${t.tsNone}</p>`}</div>`}).join('');
 document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{const k=b.dataset.ts,v=parseFloat($('ts-'+k).value);if(!(v>0))return;const d=store.get('tests',{});(d[k]=d[k]||[]).push({d:Date.now(),v});store.set('tests',d);drawTests()});}

// =============== CARGA (ACWR) ===============
const today=()=>new Date().toISOString().slice(0,10);
function drawLoad(){const t=T(),lg=store.get('load',[]);if(!$('cg-date').value)$('cg-date').value=today();
 $('cg-rv').textContent=$('cg-rpe').value;$('cg-rl').textContent=t.rpe[+$('cg-rpe').value];
 const now=Date.now(),age_=x=>Math.max(0,(now-new Date(x.d+'T12:00').getTime())/DAY),au=x=>x.m*x.r;
 const acute=lg.filter(x=>age_(x)<7).reduce((a,x)=>a+au(x),0),chron=lg.filter(x=>age_(x)<28).reduce((a,x)=>a+au(x),0)/4;
 const span=lg.length?Math.max(...lg.map(age_)):0,ratio=chron>0?acute/chron:0;
 const z=ratio<0.8?0:ratio<=1.3?1:ratio<=1.5?2:3;
 const weeks=[3,2,1,0].map(i=>lg.filter(x=>age_(x)>=i*7&&age_(x)<(i+1)*7).reduce((a,x)=>a+au(x),0)),mx=Math.max(...weeks,1);
 $('cg-body').innerHTML=!lg.length?`<div class="card"><p class="sub" style="margin:0">${t.cgNone}</p></div>`:
 `<div class="card"><div class="res"><div><b>${Math.round(acute)}</b><span>${t.cgAcute}</span></div><div><b>${Math.round(chron)}</b><span>${t.cgChronic}</span></div></div>
  ${span>=14?`<div class="zone" style="background:${t.zones[z][2]}">${t.cgRatio} ${ratio.toFixed(2)} · ${t.zones[z][0]}<div style="font-weight:400;font-size:13px;margin-top:4px">${t.zones[z][1]}</div></div><p class="note">ℹ️ ${t.cgInfo}</p>`:`<p class="note">${t.cgNeed}</p>`}</div>
  <div class="card"><label class="l">${t.cgWeeks}</label><div class="bars">${weeks.map((v,i)=>`<div><span style="color:var(--gold)">${Math.round(v)}</span><i style="height:${v/mx*90}%"></i>-${3-i}w</div>`).join('')}</div></div>
  <div class="card"><label class="l">${t.cgHist}</label><div class="list">${lg.slice(-6).reverse().map(x=>`<div class="it"><span style="color:var(--mut)">${x.d.slice(5).split('-').reverse().join('.')}</span><span>${x.m}′ × ${x.r}</span><b style="color:var(--gold)">${au(x)}</b></div>`).join('')}</div></div>`;}
$('cg-rpe').oninput=()=>{$('cg-rv').textContent=$('cg-rpe').value;$('cg-rl').textContent=T().rpe[+$('cg-rpe').value]};
$('cg-add').onclick=()=>{const m=+$('cg-min').value,r=+$('cg-rpe').value,d=$('cg-date').value||today();if(!(m>0))return;const lg=store.get('load',[]);lg.push({d,m,r});lg.sort((a,b)=>a.d<b.d?-1:1);store.set('load',lg);drawLoad()};

// =============== DIÁRIO DE JOGO ===============

const GM={pt:{h:'⚽ Feedback de jogo',o:'Adversário',m:'Minutos',g:'Gols',a:'Assistências',n:'Nota',good:'Correu bem',better:'A melhorar',pos:'Posição',btn:'📲 Enviar este jogo ao treinador'},
de:{h:'⚽ Spiel-Feedback',o:'Gegner',m:'Minuten',g:'Tore',a:'Assists',n:'Note',good:'Lief gut',better:'Zu verbessern',pos:'Position',btn:'📲 Dieses Spiel an den Trainer senden'},
en:{h:'⚽ Match feedback',o:'Opponent',m:'Minutes',g:'Goals',a:'Assists',n:'Rating',good:'Went well',better:'To improve',pos:'Position',btn:'📲 Send this match to the coach'}};
function gameMsg(x){const L=GM[lang]||GM.pt,t=T(),nm=store.get('name','');let s=t.msgHead+'\n'+L.h+' · '+fdate(x.d)+'\n';if(nm)s+=t.msgName+': '+nm+'\n';try{s+=L.pos+': '+POS()[cur].nome+'\n'}catch(e){}
 s+=L.o+': '+(x.o||'—')+'\n'+L.m+': '+x.m+"'\n"+L.g+': '+x.g+' · '+L.a+': '+x.a+'\n'+L.n+': '+x.n+'/10';if(x.good)s+='\n✅ '+L.good+': '+x.good;if(x.better)s+='\n🎯 '+L.better+': '+x.better;return s}
function drawDiary(){const t=T(),g=store.get('games',[]);
 const tot=g.reduce((a,x)=>({m:a.m+x.m,g:a.g+x.g,a:a.a+x.a,n:a.n+x.n}),{m:0,g:0,a:0,n:0});
 $('dj-body').innerHTML=!g.length?`<div class="card"><p class="sub" style="margin:0">${t.djNone}</p></div>`:
 `<div class="card"><label class="l">${t.djSeason}</label><div class="res" style="grid-template-columns:repeat(4,1fr)"><div><b>${g.length}</b><span>${t.djGames}</span></div><div><b>${tot.m}</b><span>${t.djMin}</span></div><div><b>${tot.g}</b><span>${t.djG}</span></div><div><b>${tot.a}</b><span>${t.djA}</span></div></div><p style="margin-top:10px;font-size:13px">${t.djAvg}: <b style="color:var(--gold)">${(tot.n/g.length).toFixed(1)}</b></p></div>`+
 g.slice().reverse().slice(0,10).map((x,i)=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(x.o||'—')}</b><span class="tag">${x.n}/10</span></div><p class="ref">${fdate(x.d)} · ${x.m}′ · ⚽ ${x.g} · 🅰️ ${x.a}</p>${x.good?`<p style="font-size:13px;margin-top:6px">✅ ${esc(x.good)}</p>`:''}${x.better?`<p style="font-size:13px;margin-top:4px">🎯 ${esc(x.better)}</p>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="chip" target="_blank" rel="noopener" style="text-decoration:none;border-color:#25D366;color:#25D366" href="${waLink(gameMsg(x))}">${(GM[lang]||GM.pt).btn}</a><button class="chip" data-del="${g.length-1-i}">${t.del}</button></div></div>`).join('');
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const gg=store.get('games',[]);gg.splice(+b.dataset.del,1);store.set('games',gg);drawDiary()});}
$('dj-add').onclick=()=>{const g=store.get('games',[]);g.push({d:Date.now(),o:$('dj-opp').value.trim(),m:+$('dj-min').value||0,g:+$('dj-g').value||0,a:+$('dj-a').value||0,n:Math.min(10,Math.max(1,+$('dj-n').value||7)),good:$('dj-good').value.trim(),better:$('dj-better').value.trim()});
 store.set('games',g);['dj-opp','dj-good','dj-better'].forEach(i=>$(i).value='');$('dj-g').value=0;$('dj-a').value=0;drawDiary();
 const t=T();$('dj-send').innerHTML=`<div class="card" style="border-color:#1f5a34;background:#0f1d14"><p style="font-size:14px;line-height:1.5;margin-bottom:12px">✅ ${t.wr.afterGame}</p><input type="text" id="dj-name" placeholder="${t.namePh}" value="${esc(store.get('name',''))}" style="margin-bottom:10px"><a class="btn" id="dj-wa" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;background:#25D366;color:#0b2e17">${(GM[lang]||GM.pt).btn}</a><button class="btn ghost" data-go="relatorio" style="margin-top:10px">👁️ ${t.rpTitle}</button></div>`;
 const up=()=>{$('dj-wa').href=waLink(gameMsg(store.get('games',[]).slice(-1)[0]))};$('dj-name').oninput=()=>{store.set('name',$('dj-name').value.trim());up()};
 $('dj-wa').onclick=()=>{store.set('reportSent',Date.now());$('dj-wa').textContent=t.wr.sent};up();$('dj-send').scrollIntoView({behavior:'smooth'})};

// =============== MENTAL ===============
let brT=null,brI=0;
function drawMental(){const t=T();$('mn-body').innerHTML=t.mental.map(a=>`<details class="acc"><summary>${a[0]}</summary><div class="bd">${a[1]}</div></details>`).join('');
 $('br-c').textContent='4·4·4·4';$('br-go').textContent=brT?t.brStop:t.brStart;}
function stopBreath(){if(brT){clearInterval(brT);brT=null;const c=$('br-c');c.style.transform='scale(1)';c.textContent='4·4·4·4';$('br-go').textContent=T().brStart}}
$('br-go').onclick=()=>{if(brT){stopBreath();return}const c=$('br-c'),t=T();brI=0;
 const step=()=>{const s=brI%4;c.textContent=T().br[s];c.style.transform=s===0?'scale(1.25)':s===2?'scale(.85)':c.style.transform;brI++};
 step();brT=setInterval(step,4000);$('br-go').textContent=t.brStop;};

// =============== MINHA SEMANA ===============
let wk=null;
const tasks=()=>{const b=T().base;return [b[0],P().tarefa,...b.slice(1)]};
const empty=()=>Array.from({length:5},()=>Array(7).fill(false));
function loadWeek(){wk=store.get('week_'+cur,null);if(!wk||wk.length!==5)wk=empty()}
const todayIdx=()=>(new Date().getDay()+6)%7;
function drawW(){if(!cur)return;const g=$('w-grid'),TS=tasks();
 g.innerHTML=`<div class="week">${T().days.map((d,i)=>`<div class="day" style="${i===todayIdx()?'color:var(--gold)':''}">${d}</div>`).join('')}</div>`+
 TS.map((x,ti)=>{const n=wk[ti].filter(Boolean).length;return `<div class="trow"><div class="h"><b style="font-weight:500">${x[0]} ${x[1]}</b><span>${n}/7</span></div><div class="week">${wk[ti].map((v,di)=>`<div class="chk ${v?'on':''}" data-t="${ti}" data-d="${di}">${v?'✓':''}</div>`).join('')}</div></div>`}).join('');
 $('w-pct').textContent=weekPct()+'%';
 g.querySelectorAll('.chk').forEach(c=>c.onclick=()=>{wk[c.dataset.t][c.dataset.d]=!wk[c.dataset.t][c.dataset.d];store.set('week_'+cur,wk);drawW()});}
const weekPct=()=>{const a=wk.flat();return Math.round(a.filter(Boolean).length/a.length*100)};
$('w-reset').onclick=()=>{wk=empty();store.set('week_'+cur,wk);drawW()};

// =============== RELATÓRIO PARA OS PAIS ===============
function acwrInfo(){const t=T(),lg=store.get('load',[]),now=Date.now(),ag=x=>Math.max(0,(now-new Date(x.d+'T12:00').getTime())/DAY),au=x=>x.m*x.r;
 const acute=lg.filter(x=>ag(x)<7).reduce((a,x)=>a+au(x),0),chron=lg.filter(x=>ag(x)<28).reduce((a,x)=>a+au(x),0)/4,span=lg.length?Math.max(...lg.map(ag)):0,ratio=chron>0?acute/chron:0;
 const z=ratio<0.8?0:ratio<=1.3?1:ratio<=1.5?2:3;return {acute:Math.round(acute),ratio,zone:span>=14&&chron>0?t.zones[z][0]:null}}
function buildReport(){const t=T(),r=t.rp,W=t.wr,L2=[],nm=store.get('name','');
 L2.push(W.head+' · '+new Date().toLocaleDateString(t.loc));
 if(nm)L2.push(t.msgName+': '+nm);
 L2.push(r.pos+': '+P().nome+' · '+t.week(selW)+' ('+Object.keys(store.get('prog_'+cur,{})).length+'/36)','');
 const g=store.get('games',[]);
 if(g.length){const x=g[g.length-1];L2.push(W.game+' ('+fdate(x.d)+'): '+(x.o?W.vs+' '+x.o+' · ':'')+x.m+'′ · ⚽ '+x.g+' · 🅰️ '+x.a+' · '+W.rating+' '+x.n+'/10');if(x.good)L2.push(W.good+': '+x.good);if(x.better)L2.push(W.better+': '+x.better);L2.push('')}
 const SH=store.get('sess_'+cur,[]).filter(x=>Date.now()-x.d<7*DAY);
 L2.push(W.sess+': '+(SH.length||W.noSess));
 SH.forEach(x=>L2.push('• '+sessLabel(x.w,x.s)+' ('+sessName(x.w,x.s)+') · '+(x.q?'⭐'+x.q+'/5 · ':'')+'RPE '+x.r+'/10'+(x.n?' · "'+x.n+'"':'')));
 const A=acwrInfo();L2.push(W.load+': '+A.acute+(A.zone?' · ACWR '+A.ratio.toFixed(2)+' ('+A.zone+')':''),'');
 const TS=tasks();L2.push(W.habits+': '+weekPct()+'%',TS.map((x,i)=>x[0]+' '+wk[i].filter(Boolean).length+'/7').join(' · '),'');
 const h=store.get('diag_'+cur,[]);if(h.length){const d=diagCalc(P().quiz,h[h.length-1].a);L2.push(W.diag+': '+d.pct+'/100 · '+r.prio+': '+(d.even?t.noWeak:d.weak))}
 const ts=store.get('tests',{}),tl=Object.keys(t.tests).filter(k=>(ts[k]||[]).length).map(k=>{const R_=REF[k],v=ts[k].map(x=>x.v),best=R_.lower?Math.min(...v):Math.max(...v),dd=+(v[v.length-1]-v[0]).toFixed(2);return t.tests[k][0].replace(/^\S+\s/,'')+' '+best+t.tests[k][1]+(v.length>1?' ('+(dd>0?'+':'')+dd+')':'')});
 if(tl.length)L2.push(W.tests+': '+tl.join(' · '));
 const AH=store.get('aval_'+cur,[]);if(AH.length){const S=avScores(AH[AH.length-1].sc);L2.push('📋 '+AVT[lang].title+': '+S.tot[0]+'/'+S.tot[1]+' ('+fdate(AH[AH.length-1].d)+')')}
 L2.push('',r.sign);return L2.join('\n')}
function drawReport(){const t=T(),txt=buildReport(),nm=store.get('name','');
 $('rp-text').textContent=txt;$('rp-msg').textContent='';
 $('rp-name').placeholder=t.namePh;$('rp-name').value=nm;$('rp-wa').textContent=t.wr.send;$('rp-wa').href=waLink(txt);
 $('rp-wa').onclick=()=>{store.set('reportSent',Date.now());$('rp-msg').style.color='var(--ok)';$('rp-msg').textContent=t.wr.sent};
 $('rp-name').onchange=()=>{store.set('name',$('rp-name').value.trim());drawReport()};}
$('rp-copy').onclick=async()=>{try{await navigator.clipboard.writeText($('rp-text').textContent);$('rp-msg').style.color='var(--ok)';$('rp-msg').textContent=T().rpCopied}catch(e){$('rp-msg').style.color='var(--mut)';$('rp-msg').textContent=T().rpFail}};

// =============== INICIAR ===============
loadWeek();applyLang();show();
</script>
