<style>
:root{--bg:#0B0B0C;--card:#151517;--card2:#1D1D20;--line:#2A2A2E;--gold:#C9A84C;--txt:#F2F0EA;--mut:#9A978F;--ok:#5FBF7A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100%}
body{padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px)}
.wrap{max-width:460px;margin:0 auto}
.mono{font-family:'DM Mono',monospace}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.shield{width:42px;height:48px;flex:none}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:'DM Mono';font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
.brand b{font-family:'Bebas Neue';font-size:26px;letter-spacing:.03em;line-height:1;display:block}
.back{background:none;border:1px solid var(--line);color:var(--txt);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer;flex:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter;flex:none}
.hero{background:linear-gradient(135deg,#1a1710,#0f0f10 60%);border:1px solid #3a321c;border-radius:20px;padding:22px 20px;margin-bottom:22px;position:relative;overflow:hidden}
.hero h1{font-family:'Bebas Neue';font-size:44px;line-height:.95}
.hero h1 span{color:var(--gold)}
.hero p{color:var(--mut);font-size:14px;margin-top:10px;line-height:1.5;max-width:300px}
.hero .bignum{position:absolute;right:14px;top:-10px;font-family:'Bebas Neue';font-size:150px;color:var(--gold);opacity:.1;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;cursor:pointer;text-align:left;color:var(--txt);transition:transform .15s,border-color .15s;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;font-family:Inter}
.tile:active{transform:scale(.97)}.tile:hover{border-color:var(--gold)}
.ico{width:46px;height:46px;border-radius:14px;background:rgba(201,168,76,.12);display:grid;place-items:center;font-size:22px}
.tile h3{font-size:15px;font-weight:600;margin-top:14px}
.tile p{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.4}
.num{font-family:'DM Mono';font-size:10px;color:var(--gold);letter-spacing:.12em}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:26px;font-family:'DM Mono';letter-spacing:.08em}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sub{color:var(--mut);font-size:14px;margin:6px 0 20px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.btn{display:block;width:100%;background:var(--gold);color:#111;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:15px;cursor:pointer;font-family:Inter}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-size:15px;cursor:pointer;font-family:Inter}
.opt:hover{border-color:var(--gold)}
.score{font-family:'Bebas Neue';font-size:80px;color:var(--gold);line-height:1}
.tag{display:inline-block;font-family:'DM Mono';font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(201,168,76,.15);color:var(--gold)}
.pill-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.pl{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pl .b{flex:1;height:6px;background:var(--card2);border-radius:99px;margin:0 10px;overflow:hidden}
.pl .b i{display:block;height:100%;background:var(--gold)}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-family:'DM Mono';letter-spacing:.06em;text-transform:uppercase}
input[type=number]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px;font-size:18px;font-family:'DM Mono'}
input:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:11px 4px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:Inter}
.seg button.on{background:var(--gold);color:#111}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res div{background:var(--card2);border-radius:14px;padding:14px}
.res b{display:block;font-family:'Bebas Neue';font-size:32px;color:var(--gold);line-height:1}
.res span{font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin-top:12px}
ul.tips{list-style:none;margin-top:6px}
ul.tips li{font-size:14px;padding:9px 0;border-bottom:1px solid var(--line);line-height:1.45}
ul.tips li:last-child{border:0}
ul.tips li b{color:var(--gold);font-weight:600}
.timer{font-family:'Bebas Neue';font-size:96px;text-align:center;line-height:1;margin:6px 0}
.ring{position:relative;width:220px;height:220px;margin:4px auto 10px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.phase{font-family:'DM Mono';font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.ex-name{font-size:20px;font-weight:700;text-align:center}
.ex-desc{color:var(--mut);font-size:14px;text-align:center;line-height:1.5;margin:6px 0 16px;min-height:42px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}.dots i.done{background:#6b5a28}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.day{text-align:center;font-family:'DM Mono';font-size:11px;color:var(--mut)}
.chk{aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;font-size:14px;color:#111;font-weight:700}
.chk.on{background:var(--gold);border-color:var(--gold)}
.trow{margin-bottom:14px}
.trow .h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.trow .h span{color:var(--gold);font-family:'DM Mono';font-size:12px}
.big{font-family:'Bebas Neue';font-size:56px;color:var(--gold);line-height:1}
/* picker */
.pos-list{display:flex;flex-direction:column;gap:10px}
.pos{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--txt);text-align:left;font-family:Inter;width:100%}
.pos:hover,.pos.on{border-color:var(--gold)}
.pos .n{font-family:'Bebas Neue';font-size:34px;color:var(--gold);width:40px;text-align:center;line-height:1}
.pos b{display:block;font-size:16px}
.pos span{font-size:12px;color:var(--mut)}
.pos .ar{margin-left:auto;color:var(--mut);font-size:20px}
.pitch{background:#10251a;border:1px solid #1f3d2b;border-radius:18px;position:relative;aspect-ratio:3/2.1;margin-bottom:18px;overflow:hidden}
.pitch .ln{position:absolute;border:1.5px solid rgba(255,255,255,.18)}
.pitch .dot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#0B0B0C;border:2px solid var(--gold);color:var(--gold);font-family:'Bebas Neue';font-size:18px;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.pitch .dot:hover,.pitch .dot.on{background:var(--gold);color:#111;transform:translate(-50%,-50%) scale(1.12)}
</style>
</head>

 tips:{desc:['<b>Erholungstag</b>: Protein auf alle Mahlzeiten verteilen.','Mehr Gemüse und Früchte, moderate Kohlenhydrate.','<b>Genug Schlaf</b> ist das beste Supplement: 9–12 Std. (6–12 Jahre), 8–10 Std. (13–18 Jahre).'],
  treino:['<b>2–3 Std. vorher</b>: normale Mahlzeit mit Kohlenhydraten (Reis, Pasta, Kartoffeln) + Protein.','Flasche mitnehmen und während des Trainings regelmässig trinken.','<b>Bis 1 Std. danach</b>: Protein + Kohlenhydrate (Joghurt, Banane, Poulet-Sandwich).','Vorher und nachher wiegen: <b>mehr als 2 %</b> Gewichtsverlust heisst zu wenig getrunken.'],
  jogo:['<b>3 Std. vorher</b>: kohlenhydratreiche Mahlzeit, wenig Fett und wenig Ballaststoffe.','<b>1 Std. vorher</b>: leichter Snack (Banane, Brot mit Honig).','In der Pause: Wasser und bei intensiven Spielen Früchte oder ein Sportgetränk.','Nach dem Spiel: vollständige Mahlzeit und viel Wasser.']},
 nAdv:'Premium · Ernährung für Fortgeschrittene',
 adv:[['🍽️ Spieltag-Menü (Anpfiff 15 Uhr)','<b>08:00</b> Vollkornbrot, Rührei, Früchte, Wasser.<br><b>11:30</b> Reis oder Pasta, Poulet oder Fisch, gekochtes Gemüse. Wenig Fett.<br><b>13:45</b> Banane oder Brot mit Honig + 300–500 ml Wasser.<br><b>Pause</b> Wasser; bei Hitze oder intensivem Spiel Sportgetränk oder Orangenschnitze.<br><b>17:00</b> Erholung: Schokomilch oder Joghurt + Früchte.<br><b>19:00</b> Vollständiges Abendessen: Kohlenhydrate + Protein + Gemüse.'],
  ['🏆 Turnier mit 2+ Spielen am selben Tag','Zwischen den Spielen <b>unter 1 Std.</b>: nur Getränke und etwas Leichtes (Banane, Müesliriegel, Fruchtschnitze).<br>Zwischen den Spielen <b>1–3 Std.</b>: kleines Weissbrot-Sandwich mit Truthahn oder Frischkäse, Früchte.<br><b>Alle 15–20 Min. kleine Schlucke</b> trinken. Kein Frittiertes, keine schweren Saucen, keine Softdrinks.<br>Immer eine <b>Znüni-Box</b> mitnehmen: An Turnieren gibt es selten gutes Essen.'],
  ['🥩 Einfache Proteinquellen','Eier, griechischer Joghurt, Hüttenkäse, Milch, Poulet, Truthahn, Fisch, Thon aus der Dose, mageres Rindfleisch, Bohnen und Linsen. Ziel: <b>eine Quelle pro Mahlzeit</b>.'],
  ['😴 Erholung und Schlaf','Der Grossteil der Erholung passiert im Schlaf. 6–12 Jahre: <b>9–12 Std.</b>; 13–18 Jahre: <b>8–10 Std.</b>; Erwachsene: <b>7 Std. oder mehr</b>. Bildschirme 30–60 Min. vor dem Schlafen aus. Ein Joghurt oder Milch vor dem Schlafen unterstützt die Muskelerholung.']],

  ['🎯 Visualisierung (5 Min. am Abend)','Augen schliessen und 3 typische Aktionen deiner Position im Detail vorstellen, wie sie gelingen: was du siehst, hörst und fühlst. Das Gehirn trainiert die Bewegung auch ohne Ball.'],
  ['💬 Innerer Dialog','Ersetze "Ich darf keinen Fehler machen" durch "<b>Ich greife den Ball an</b>". Kurze Sätze, in der Gegenwart, mit Aktion. Wähle 2 und wiederhole sie beim Aufwärmen.']],

 tips:{desc:['<b>Recovery</b> day: spread protein across all meals.','More vegetables and fruit, moderate carbs.','<b>Enough sleep</b> is the best supplement: 9–12 h (ages 6–12), 8–10 h (ages 13–18).'],
  treino:['<b>2–3 h before</b>: normal meal with carbs (rice, pasta, potatoes) + protein.','Bring a bottle and sip regularly during training.','<b>Within 1 h after</b>: protein + carbs (yoghurt, banana, chicken sandwich).','Weigh yourself before and after: losing <b>more than 2%</b> of body weight means you drank too little.'],

 adv:[['🍽️ Match-day menu (3 pm kick-off)','<b>08:00</b> Wholegrain bread, scrambled eggs, fruit, water.<br><b>11:30</b> Rice or pasta, chicken or fish, cooked vegetables. Low fat.<br><b>13:45</b> Banana or bread with honey + 300–500 ml water.<br><b>Half-time</b> Water; if hot or intense, a sports drink or orange slices.<br><b>17:00</b> Recovery: chocolate milk or yoghurt + fruit.<br><b>19:00</b> Full dinner: carbs + protein + vegetables.'],
  ['🏆 Tournament with 2+ games in one day','<b>Under 1 h</b> between games: drinks and something light only (banana, cereal bar, fruit slices).<br><b>1–3 h</b> between games: small white-bread sandwich with turkey or cottage cheese, fruit.<br><b>Small sips every 15–20 min</b>. Avoid fried food, heavy sauces and soft drinks.<br>Always pack a <b>lunch box</b>: tournaments rarely have good food.'],
  ['🥩 Easy protein sources','Eggs, Greek yoghurt, cottage cheese, milk, chicken, turkey, fish, tinned tuna, lean red meat, beans and lentils. Goal: <b>one source at every meal</b>.'],
