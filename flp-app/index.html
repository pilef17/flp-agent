que explosivo nas costas do defensor", "Receber + finalizar"]], ["Erros Comuns", ["Apelo inicial fraco — defensor não \"morde\"", "Pique demasiado cedo — defensor consegue recuperar", "Falta de aceleração máxima no contra-movimento"]]], "params": ["Repetições: 10 por lado", "Oposição: progressiva"], "tip": "⚡ Benzema é o modelo de referência: apelo de apoio convincente → pique de velocidade → 1 tempo de avanço", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Apelo Arredondado — Gerir o Fora-de-Jogo", "d": "Linha de 3 cones representa a linha defensiva. O atacante começa atrás da linha (em posição de fora-de-jogo). Acompanha a linha lateralmente e, no momento em que o passador bate a bola, mergulha em diagonal para a área. A curva da corrida permite manter-se em jogo mais tempo que o apelo direto.", "min": 15, "blocks": [["Organização", ["3 cones em linha = defesa", "Atacante acompanha a linha lateralmente", "No momento da passe: pique em diagonal", "Chegar em jogo + finalizar"]], ["Diferença vs. Apelo Direto", ["Direto: risco de fora-de-jogo com mau timing", "Arredondado: mantém em jogo mais tempo", "Chega com mais velocidade de inserção", "Receção face ao golo naturalmente"]]], "params": ["Repetições: 10", "Variante: com árbitro de fora-de-jogo"], "tip": "⚡ O timing é a chave: o atacante deve partir no momento exato em que o passador toca na bola", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Escolha Livre — Qual Apelo Usar?", "d": "O atacante enfrenta um defensor real (semi-ativo). Liberdade total para escolher o tipo de apelo mais adequado à posição do defensor. O coach avalia a leitura: escolheu o apelo certo para a situação? O passador decide quando soltar baseado no movimento do atacante.", "min": 15, "blocks": [], "params": ["Formato: 1v1 + passador + GR", "Repetições: 12", "Debriefing: após cada 3 reps"], "tip": "⚡ Perguntar após cada ação: \"Qual apelo usaste? Porquê? O defensor estava onde?\"", "warm": false}, {"sec": "Jogo de Finalização", "id": "F1", "n": "Competição de Apelos — Quem Marca Mais", "d": "2 atacantes em simultâneo. Cada um parte de um corredor lateral. O passador lança para o atacante que fizer o melhor apelo. Quem não recebe faz um apelo alternativo. Competição de golos marcados. Incentiva a qualidade dos apelos para \"ganhar\" a bola.", "min": 15, "blocks": [], "params": ["Duração: 3x5 min", "Regra: 1 pt por golo, 0.5 pt por apelo perfeito sem golo"], "tip": "⚡ O coach pode atribuir pontos pelo apelo mesmo sem receber — reforçar que a corrida tem valor", "warm": false}]}, {"t": "Jogo de Apoio — Costas ao Jogo", "sub": "Proteção de bola, remise, girar e posicionamento interlinha", "phase": 1, "obj": [["Objetivos", ["Proteger a bola de costas sob pressão", "Remise de qualidade em 1 toque", "Identificar quando girar vs. quando remeter", "Posicionar-se entre as linhas defensivas"]], ["Comportamentos", ["Corpo largo: ocupar espaço com braços e pernas", "Pé de apoio afastado da bola (proteção)", "Cabeça levantada antes de receber", "Remise precisa — não aleatória"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Rondo 3v1 — Proteção e Apoio", "d": "Rondo clássico num quadrado de 8x8m. 3 jogadores mantêm a posse, 1 pressiona. Foco: receção com o corpo entre a bola e o adversário, remise segura em 1 toque. Rotação após 5 interceções ou 2 minutos.", "min": 15, "blocks": [], "params": ["Espaço: 8x8m", "Formato: 3v1", "Duração: 15 min com rotações"], "tip": "⚡ Insistir na posição do corpo — nunca de frente para o adversário ao receber", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Proteção de Bola sob Pressão Direta", "d": "Atacante recebe de costas com um defensor colado. Objetivo: manter a bola por 3 segundos e remeter para o passador ou girar para a frente. O defensor tenta roubar ativamente. O atacante deve usar o corpo, braços e posicionamento do pé de apoio para proteger.", "min": 12, "blocks": [["Técnica de Proteção", ["Corpo entre a bola e o defensor", "Braço aberto para sentir a pressão", "Pé de apoio afastado — bola longe do defensor", "Centro de gravidade baixo"]], ["Decisão", ["Defensor colado → remise imediata", "Defensor não segue o decrochamento → girar", "Pressão lateral → usar o defensor como escudo"]]], "params": ["Repetições: 12", "Tempo de proteção alvo: 3 seg"], "tip": "⚡ Ref: Ibrahimović e Gabriel Jesus — corpo largo, transferência de peso rápida", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Remise e Desvio em 1 Toque", "d": "Dois passadores em posições diferentes. O atacante recebe de costas e remete para o passador livre. Em seguida, faz um apelo em profundidade e recebe a bola para finalizar. A qualidade da remise em 1 toque é o foco — precisão e direção.", "min": 15, "blocks": [["Tipos de Remise", ["Remise simples (para trás, ao passador)", "Desvio lateral (para o 3º homem)", "Desvio em profundidade (para o companheiro em corrida)"]], ["Sequência", ["Receção de costas → remise → apelo → receção → finalização", "Sem parar entre ações", "Qualidade da remise determina a qualidade do apelo seguinte"]]], "params": ["Séries: 6", "Intensidade: média-alta"], "tip": "⚡ Uma má remise anula o trabalho coletivo — exigir precisão máxima mesmo sob pressão", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Posicionamento Interlinha — Fixar e Libertar", "d": "Jogo posicional 4v4+2 apoios externos. O atacante posiciona-se entre as linhas para receber. Quando recebe, decide: girar e progredir, ou remeter e apelár em profundidade. Objetivo: entender que a presença entre as linhas fixa 2-4 adversários mesmo sem receber a bola.", "min": 18, "blocks": [], "params": ["Espaço: 25x20m", "Formato: 4v4+2 apoios", "Duração: 3x6 min"], "tip": "⚡ Perguntar ao atleta: \"Quando estás entre as linhas, quantos defesas estão a olhar para ti?\"", "warm": false}, {"sec": "Jogo de Finalização", "id": "F1", "n": "Cadeia Completa — Apoio + Profundidade + Golo", "d": "Sequência completa: 1) Atacante recebe de costas e protege; 2) Remete para o passador; 3) Faz apelo em profundidade (livre de escolher qual dos 4 tipos); 4) Recebe e finaliza. Integra os 3 fundamentos das sessões 1, 2 e 3.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Com GR: sim", "Oposição: 1 DEF semi-ativo"], "tip": "⚡ Avaliar as 3 fases: proteção, remise e apelo — feedback individualizado após cada série", "warm": false}]}, {"t": "Finalização na Área", "sub": "Velocidade de execução, 1-2 toques, superfície de pé e leitura do GR", "phase": 2, "obj": [["Objetivos", ["Finalizar em 1 toque com eficácia", "Identificar a posição do GR antes de rematar", "Usar a superfície de pé correta em cada situação", "Manter velocidade de execução sob pressão"]], ["Estatísticas de Referência", ["90% dos golos marcados dentro da área", "72% marcados em 1 toque", "88% em 1 ou 2 toques", "90% após esforço intenso (sprint ou salto)"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Finalização — Passes e Remates", "d": "Sprint de 10m → receber a bola do coach → remate ao alvo (cones nos cantos da baliza). Começa lento, aumenta progressivamente a velocidade de chegada. Trabalhar os dois pés.", "min": 15, "blocks": [], "params": ["Repetições: 10 por pé", "Distância de remate: 8-14m"], "tip": "⚡ Desde o início: cabeça levantada para ver o GR antes de rematar", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Finição de Superfície — 4 Ângulos", "d": "Uma fonte de bola em cada ângulo dos 5,5m da baliza. O atleta fica atrás do arco. Recebe de um ângulo e remata em 1 ou 2 toques. Alternância sistemática de ângulos. Competição: 10 remates, contar golos. Exigir sempre verificação da posição do GR antes de finalizar.", "min": 15, "blocks": [["Ângulos de Trabalho", ["Frontal direito (interior do pé)", "Frontal esquerdo (interior ou peito)", "Lateral direito (peito ou 1ª vez)", "Lateral esquerdo (pé não dominante)"]], ["Evolução", ["Passe ao solo → passe semi-elevado → passe elevado", "Exigir 1 toque obrigatório", "Adicionar sprint de 5m antes da receção"]]], "params": ["Repetições: 10 por ângulo", "Descanso: 20s entre reps"], "tip": "⚡ Guardiola: \"Na área, um atacante parado é um atacante morto\" — mínimo 3m de corrida antes de cada remate", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Múltiplas Finições em Sequência", "d": "O atleta executa 3 finições em sequência sem parar: 1) Remate frontal após condução + eliminação de cone; 2) Uma-dois com companheiro → remate; 3) Centro do lado → finalização 1 toque. Simula o esforço acumulado de um ataque.", "min": 15, "blocks": [], "params": ["Séries: 6", "Descanso entre séries: 45s", "Intensidade: alta"], "tip": "⚡ Avaliar a qualidade do 3º remate — quando o atleta está cansado, mantém a técnica?", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Face a Face Simples — Decisão Rápida", "d": "Bola lançada em profundidade. O atacante recebe em velocidade com apenas o GR pela frente. Foco total na leitura da posição do guarda-redes e na decisão certa: rematar, picar ou contornar.", "min": 15, "blocks": [["Decisão por Situação", ["GR na linha → rematar cruzado ao solo", "GR avançado → picar por cima", "GR saindo → contornar + finalizar", "GR no meio → mascarar e decidir no último momento"]], ["Avaliação do Coach", ["O atleta olhou para o GR antes de decidir?", "Manteve velocidade até ao remate?", "Usou a superfície de pé adequada?"]]], "params": ["Repetições: 12", "GR: real, ativo"], "tip": "⚡ O GR deve variar a posição entre cada repetição para forçar nova leitura", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Competição de Finalização — 2 Equipas", "d": "2 equipas de 2-3. Alternância de ataques. Cada equipa tem 10 tentativas. Contam golos. Ponto bónus se o golo for marcado em 1 toque. Ponto bónus adicional se a decisão (picar, cruzado, contornar) foi perfeita para a posição do GR.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Sistema de pontos: golo=1pt, 1 toque=+0.5pt, decisão perfeita=+0.5pt"], "tip": "⚡ Debater no final: qual foi o golo mais difícil? Qual a decisão mais inteligente?", "warm": false}]}, {"t": "Marcar no Centro", "sub": "Apelos na área, espaço cego, coordenação de corridas e timing", "phase": 2, "obj": [["Objetivos", ["Usar o espaço cego do defensor", "Chegar em movimento ao centro", "Coordenar corridas com companheiros (1º e 2º poste)", "Rematar de onde veio o centro"]], ["Comportamentos", ["Começar o apelo antes do centro ser feito", "Posicionar-se atrás do defensor antes do centro", "Nunca estático — sempre em movimento", "Comunicação com companheiro atacante"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Corridas na Área", "d": "Na área de grande penálti, o atacante pratica corridas ao 1º e 2º poste a partir de diferentes posições. Sem bola primeiro, depois com bola parada e por fim com centro real. O objetivo é programar os padrões de corrida na área antes de adicionar intensidade.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Progressão: sem bola → bola parada → centro real"], "tip": "⚡ Insistir no apelo ao 1º poste como arma privilegiada — força o defensor a decidir", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Espaço Cego — Posicionamento Antes do Centro", "d": "Defensor estático representa o central. O atacante posiciona-se voluntariamente atrás do defensor (espaço cego). Quando o centreur cruza, o atacante arranca. O defensor não pode ver o atacante e o centreur ao mesmo tempo — vantagem garantida.", "min": 15, "blocks": [["Conceito", ["Defensor foca no centreur → não vê o atacante", "Atacante no espaço cego = 1 metro de avanço garantido", "Arranque explosivo no momento do centro", "Mudança de ritmo antes do arranque"]], ["Evolução", ["Defensor estático → defensor passivo → defensor ativo", "Adicionar 2º atacante (1º e 2º poste)", "Centreur varia: ao solo, elevado, tenso, lobado"]]], "params": ["Repetições: 12", "Defesa: progressiva"], "tip": "⚡ Referência Cavani: posicionamento nas costas antes do centro → arranque → 1 metro de vantagem", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Rematar de Onde Veio o Centro", "d": "Centro da direita: o GR tende a antecipar para o centro. O remate redirigido para a direita apanha-o em contramovimento. Centro da esquerda: inverso. Trabalhar a decisão rápida de redirigir o centro de onde veio.", "min": 15, "blocks": [["Princípio", ["Centro direita → GR move para o centro", "Remate para a direita → GR em contramovimento", "Aplicável ao pé e à cabeça"]], ["Referência", ["Lewandowski vs RB Leipzig: cabeçada de onde veio", "GR foi para o centro — ângulo oposto aberto", "Mesmo princípio com o pé"]]], "params": ["Centros da direita: 8", "Centros da esquerda: 8"], "tip": "⚡ Exigir que o atleta verbalize a posição do GR antes de rematar", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Coordenação 2 Atacantes — 1º e 2º Poste", "d": "Dois atacantes coordenam as corridas: um vai ao 1º poste, o outro ao 2º. O centreur decide para quem centrar baseado nos movimentos. O atacante do 1º poste pode finalizar, desviar para o 2º, ou deixar passar (passe fantasma).", "min": 15, "blocks": [], "params": ["Formato: 2 ATK + centreur + GR", "Oposição: 1-2 DEF", "Repetições: 10"], "tip": "⚡ Insistir na comunicação verbal ou gestual entre os dois atacantes antes do centro", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Centro com Oposição Real", "d": "Situação de jogo real: 3 atacantes vs 2 defensores + GR. Centradores nos corredores. 4 passes máximo antes de cruzar. Os atacantes coordenam as corridas na área. Os defensores defendem ativamente.", "min": 15, "blocks": [], "params": ["Formato: 3v2 + GR + 2 centreurs", "Duração: 3x5 min", "Regra: máx 4 passes antes do centro"], "tip": "⚡ Debater no final: qual o apelo mais eficaz? Quando o passe fantasma teria funcionado?", "warm": false}]}, {"t": "Arte do Face a Face com o GR", "sub": "Leitura, decisão, mascarar intenções e gestão do corpo", "phase": 2, "obj": [["Objetivos", ["Ler a posição do GR antes de decidir", "Dominar as 3 opções: rematar, picar, contornar", "Mascarar intenções até ao último momento", "Colocar-se na corrida do defensor para proteção"]], ["Decisão por Situação", ["GR adiantado → picar por cima", "GR na linha → rematar cruzado ao solo", "GR saindo → contornar + finalizar", "GR no meio → mascarar + decidir no último segundo"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Condução e Remate Após Cone", "d": "Condução de bola em velocidade → eliminar cone (representa o defensor) → reta para o GR → finalizar. Progressão de velocidade: 50% → 75% → 100%. Trabalhar os dois pés.", "min": 15, "blocks": [], "params": ["Repetições: 12 por pé", "Distância: 20-25m de corrida"], "tip": "⚡ Cabeça levantada no último cone — identificar a posição do GR antes de rematar", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "GR Varia a Posição — 3 Decisões", "d": "O GR adota sistematicamente uma das 3 posições (adiantado, na linha, saindo). O atacante recebe e deve identificar e executar a decisão certa. O GR não comunica — o atacante tem de ler. Após 4 repetições, o coach revela a taxa de decisões corretas.", "min": 15, "blocks": [], "params": ["Repetições: 15", "GR: varia posição aleatoriamente", "Meta: >80% de decisões corretas"], "tip": "⚡ Se o atleta não está a ler o GR, pedir para dizer a posição do GR em voz alta antes de rematar", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Mascarar as Intenções — Fechar no Último Momento", "d": "O atacante arma o remate para um lado — o GR antecipa. O atacante fecha o pé no último momento para o lado oposto. Foco total na capacidade de enganar o GR com o gesto de preparação do remate.", "min": 15, "blocks": [["Técnica", ["Armar o remate para a esquerda (GR muda)", "Fechar o pé no último momento → direita", "Inverso também (armar direita → fechar esquerda)", "Manter a velocidade de execução"]], ["Referências", ["Mbappé: entre as pernas do defensor", "Messi: arma → fecha → ângulo contrário", "Haaland: interior do pé ao solo após leitura"]]], "params": ["Repetições: 12", "Com defensor: progressivo"], "tip": "⚡ A velocidade de execução é o que torna impossível para o GR reagir após a feinte", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Gestão do Corpo — Colocar-se na Corrida do Defensor", "d": "Com defensor em perseguição, o atacante aprende a colocar-se na linha de corrida do defensor. Se o defensor toca, é falta. O atacante protege a bola com o corpo e finaliza. Ensinar a diferença entre parar a direito (permite retorno do defensor) e cruzar a corrida do defensor (bloqueia o retorno).", "min": 15, "blocks": [], "params": ["Formato: 1v1 em perseguição + GR", "Distância de vantagem: 2-3m", "Repetições: 10"], "tip": "⚡ Ref: Haaland coloca-se na corrida do defensor → falta ou espaço garantido para finalizar", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Face a Face em Competição — 2 Atacantes vs 2 GR", "d": "2 atacantes em simultâneo, cada um com o seu GR. Bola lançada ao mesmo tempo. Quem marca primeiro ganha 1 ponto bónus. Após cada série de 5, um ponto adicional ao atleta com melhor decisão (não necessariamente mais golos).", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Séries de: 5 rep", "Pontuação dupla: golos + qualidade de decisão"], "tip": "⚡ A pressão da competição entre os dois atletas simula a urgência de uma situação de jogo real", "warm": false}]}, {"t": "Pressing e Jogo Defensivo", "sub": "Orientar o pressing, fechar o eixo e ser o primeiro defensor", "phase": 2, "obj": [["Objetivos", ["Reconhecer os indicadores de pressing", "Fechar o eixo central como 1ª ação", "Orientar a saída de bola para o corredor", "Coordenar o pressing a dois atacantes"]], ["Indicadores de Pressing", ["Passe para trás (ao GR ou defensor)", "Má passe — recetor sob pressão", "Recetor de costas ou mal orientado", "GR com bola nos pés após ação"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Rondo + Pressing Dirigido", "d": "Rondo 5v2 num quadrado de 15x15m. Quando o coach grita \"PRESS\", os 2 jogadores do meio intensificam imediatamente o pressing. Quando grita \"ORIENTA\", um dos dois fecha o eixo e o outro pressiona pelo corredor. Trabalha a reatividade ao indicador e a coordenação a dois.", "min": 15, "blocks": [], "params": ["Duração: 15 min com rotações", "Rotação: após 5 min ou 3 recuperações"], "tip": "⚡ O timing do pressing é tudo — arrancar cedo demais ou tarde demais é ineficaz", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Fechar o Eixo — Orientar para o Corredor", "d": "Defesa de 4 tenta sair a jogar. 1 atacante pressiona. Objetivo: fechar o eixo central (bloquear passe ao médio central) e forçar a saída pelo corredor lateral. Uma vez no corredor, o atacante fecha o retorno com apelo arredondado. O bloco da equipa ativa o pressing no corredor.", "min": 15, "blocks": [["Fluxo", ["1. Fechar eixo (bloquear passe central)", "2. Forçar lateral/corredor", "3. Apelo arredondado: fechar retorno", "4. Bloco sobe e pressiona no corredor"]], ["Erros a Corrigir", ["Pressing pelo caminho mais curto (descobre o eixo)", "Não fazer o apelo arredondado após o 1º pressing", "Arrancar sem indicador favorável"]]], "params": ["Duração: 3x5 min", "Formato: 4 DEF vs 1-2 ATK pressing"], "tip": "⚡ Ref: Griezmann no Atletico — pressing orientado que força a perda de bola no corredor", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Pressing a Dois — Coordenação ATK", "d": "Dois atacantes em pressing coordenado. Um fecha o eixo, o outro cobre o corredor. Defesa de 4 tenta sair a jogar. Regra: os dois atacantes nunca devem ser eliminados pela passe entre eles. Insistir na postura de enquadramento/cobertura permanente.", "min": 15, "blocks": [], "params": ["Duração: 3x5 min", "Formato: 4 DEF vs 2 ATK pressing"], "tip": "⚡ Regra de ouro: nunca ser eliminado pela passe entre os dois atacantes — fechar esse corredor sempre", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Reconhecer o Indicador — Pressing ou Recuar?", "d": "A defesa circula a bola. O atacante avalia em tempo real: é um indicador de pressing (passe para trás, mal orientado) → arranca; ou não é indicador → recua para bloco. Avaliar a qualidade das decisões: quantos pressos foram corretos? Quantos foram mal timing?", "min": 15, "blocks": [], "params": ["Duração: 2x8 min", "Avaliação: coach conta decisões corretas vs erradas"], "tip": "⚡ Um pressing desnecessário descobre a equipa — é tão perigoso como não pressionar quando deve", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Jogo Posicional com Regra de Pressing", "d": "Jogo 5v5 num campo de 40x30m. Regra: cada equipa tem 2 \"atacantes de pressing\" que devem fechar o eixo quando a equipa adversária tem a bola. Ponto bónus por cada recuperação de bola no meio-campo adversário após pressing organizado.", "min": 15, "blocks": [], "params": ["Duração: 3x5 min", "Bónus: +1 pt por recuperação em zona alta"], "tip": "⚡ Terminar com debriefing: qual foi o melhor pressing? Qual indicador o desencadeou?", "warm": false}]}, {"t": "Coordenação a Dois Atacantes", "sub": "Passe fantasma, apelos complementares e 2v2 com oposição real", "phase": 3, "obj": [["Objetivos", ["Coordenar apelos complementares com o 2º ATK", "Executar e reconhecer o passe fantasma", "Libertar espaço para o companheiro com o decrochamento", "Ganhar 2v2 em situação real"]], ["Conceito — Perfis Complementares", ["Um ATK em profundidade + um ATK em apoio", "Quem decroche liberta espaço para o outro", "Passe fantasma: apelo que finge receber → liberta", "Ver o companheiro é tão importante como ver a bola"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Trocas de Posição 2v0 — Ler o Companheiro", "d": "Dois atacantes trocam de posição continuamente com e sem bola. Um faz apelo em profundidade enquanto o outro decroche. Sem bola primeiro para automatizar os movimentos, depois com bola e passador. Ensinar a ler o movimento do companheiro antes de tomar a decisão.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Progressão: sem bola → com bola → com passador → com GR"], "tip": "⚡ Os dois devem fazer movimentos OPOSTOS — se um vai para a frente, o outro vai para trás", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Passe Fantasma — Aprendizagem Guiada", "d": "ATK1 posicionado no caminho do centro. ATK2 por trás. ATK1 faz o gesto de finalizar mas no último momento apaga-se e deixa a bola passar para ATK2. O adversário foi enganado pelo gesto de ATK1, ATK2 finaliza livre.", "min": 15, "blocks": [["Execução", ["ATK1: gesto convincente de finalização", "ATK1: no último momento — apaga-se lateralmente", "ATK2: corrida atrás de ATK1 → finaliza", "Comunicação prévia entre os dois: \"passo\""]], ["Ref. Históricas", ["Messi + Griezmann: passe fantasma num centro", "Lukaku + Chadli vs Japão 2018", "Terrier + Gouiri: deixa passar, Gouiri finaliza"]]], "params": ["Repetições: 10 por combinação", "Com DEF: progressivo"], "tip": "⚡ O gesto de ATK1 tem de ser convincente — se for fraco, o defensor não é enganado", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Decrochamento que Liberta Espaço", "d": "ATK1 decroche (apelo para apoio). O defensor central segue ATK1. Este movimento liberta o espaço central para ATK2 fazer apelo em profundidade. ATK1 recebe a bola em apoio e imediatamente serve ATK2 no espaço liberado. Coordenação perfeita de timings.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Roles: trocar ATK1 e ATK2 após 5 reps"], "tip": "⚡ Ref: Suarez decroche → Cavani recebe o passe no espaço central — conexão perfeita", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "2v2 Real — Coordenação Livre", "d": "2 atacantes vs 2 defensores + GR. Passador externo. Os atacantes têm liberdade total para coordenar os apelos — passe fantasma, decrochamento, profundidade+apoio. Os defensores defendem ativamente. Competição de golos entre os 2 pares de atacantes (rotação a cada 5 min).", "min": 20, "blocks": [], "params": ["Duração: 4x5 min", "Formato: 2v2 + GR + passador", "Avaliação: golos + qualidade de coordenação"], "tip": "⚡ Avaliar a comunicação: os dois atacantes estão a ler-se mutuamente ou a agir individualmente?", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Jogo 3v3 — Regra do Passe Fantasma", "d": "Jogo 3v3 num campo reduzido com GR. Regra especial: um golo precedido de passe fantasma vale 2 pontos. Incentiva os atacantes a procurar a coordenação coletiva em vez da solução individual.", "min": 15, "blocks": [], "params": ["Campo: 30x25m", "Duração: 3x5 min", "Regra bónus: passe fantasma = golo duplo"], "tip": "⚡ A regra do bónus muda o comportamento — os atletas começam a procurar a combinação naturalmente", "warm": false}]}, {"t": "Situações de Jogo — Decisão sob Pressão", "sub": "4v3, 3v2 e escolha do portador com pressão temporal", "phase": 3, "obj": [["Objetivos", ["Decidir rapidamente em situação de superioridade", "Explorar o desequilíbrio com velocidade", "Portador: individual ou coletivo?", "Finalizar após sequência de esforço intenso"]], ["Comportamentos do Portador", ["Ler: individual (condução) ou coletivo (passe)?", "Velocidade na 1ª toque em direção ao golo", "Dar a bola na corrida do companheiro", "Colocar-se na corrida do defensor que volta"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação — Passes em Velocidade + Finalização", "d": "2 jogadores em passes rápidos em corrida + finalização ao 1º toque. Progressão: 2 toques → 1 toque → 1 toque em velocidade máxima. Preparar o sistema nervoso para a rapidez de execução das situações a seguir.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Intensidade: crescente"], "tip": "⚡ Progressão de velocidade: 50% → 75% → 100% nos últimos 5 minutos", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "3v2 — Explorar a Superioridade", "d": "3 atacantes partem em transição contra 2 defensores + GR. 8 segundos para finalizar. O portador deve ler imediatamente: penetrar individualmente ou criar a superioridade passando? Os companheiros devem oferecer soluções variadas (apoio, profundidade, lado).", "min": 15, "blocks": [["Decisão do Portador", ["2 DEF fechados → passar + correr", "1 DEF saindo → conduzir e criar 2v1", "Espaço frontal livre → acelerar e finalizar", "GR avançado → picar ou servir para o lado"]], ["Companheiros", ["Afastar-se do portador (ampliar espaço)", "Oferecer opção de apoio E de profundidade", "Acompanhar até à finalização", "Recuperar a 2ª bola se o remate falhar"]]], "params": ["Repetições: 12", "Tempo limite: 8 segundos", "Reset: imediato após cada ação"], "tip": "⚡ A pressão dos 8 segundos é essencial — simula a urgência real de uma transição ofensiva", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "4v3 com Defensor em Perseguição", "d": "Combinação inicial entre 10 e 9 (uma-dois). Enquanto a combinação acontece, o jogador 3 (defensor extra) começa a correr em perseguição a partir de 10m atrás. Os 4 atacantes têm 8 segundos para marcar antes que o desequilíbrio seja anulado. Portador deve usar a vantagem de velocidade para bloquear o defensor em perseguição.", "min": 20, "blocks": [["Organização", ["Uma-dois inicial entre 10 e 9", "DEF3 parte em perseguição no momento do passe", "4 ATK vs 2 DEF estáticos + 1 DEF em perseguição", "8 segundos para finalizar"]], ["Chave Tática", ["Portador coloca-se na corrida do perseguidor", "Velocidade de progressão > velocidade do perseguidor", "Passar antes que o desequilíbrio acabe", "Alas ampliam o campo para criar espaço central"]]], "params": ["Repetições: 10", "DEF em perseguição: a 10m de desvantagem"], "tip": "⚡ Se o portador para a direito, o perseguidor consegue voltar — usar o corpo para bloquear o retorno", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Transição Ataque-Defesa + Pressing Alto", "d": "Após finalizar (ou perder a bola), os atacantes transitam imediatamente para pressing alto. O GR reinicia o jogo — os atacantes têm 3 segundos para organizar o pressing antes que a defesa saia a jogar. Integra a dimensão defensiva dos atacantes no ritmo de jogo real.", "min": 15, "blocks": [], "params": ["Duração: 3x5 min", "Janela de pressing: 3 segundos após perda"], "tip": "⚡ A transição imediata é o momento mais difícil mentalmente — insistir na intensidade após cada perda", "warm": false}, {"sec": "Jogo Final", "id": "F1", "n": "Jogo de Transições 4v4 — Alta Intensidade", "d": "Jogo 4v4 em campo 40x30m com 2 GR. Pontuação dupla em golos marcados em menos de 5 segundos após recuperação (transição direta). Incentiva a exploração imediata do desequilíbrio. Alta intensidade — pausas curtas entre séries.", "min": 15, "blocks": [], "params": ["Duração: 3x5 min", "Bónus: golo em transição direta = 2 pts", "Descanso entre séries: 90s"], "tip": "⚡ Sessão de alta exigência física — terminar com 5 min de alongamentos e debriefing coletivo", "warm": false}]}, {"t": "Integração Total", "sub": "Todos os conceitos em jogo com oposição completa e regras específicas", "phase": 3, "obj": [["Objetivos Finais", ["Integrar todos os conceitos do plano em jogo real", "Avaliar a progressão do atleta nas 10 sessões", "Autonomia de decisão sem instrução do coach", "Intensidade máxima e competição real"]], ["O Coach Avalia", ["Qualidade e timing dos apelos em profundidade", "Decisões de finalização (tipo de remate, leitura GR)", "Pressing e transição defensiva", "Coordenação com o(s) companheiro(s) atacante(s)"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Revisão dos 4 Apelos — Escolha Livre", "d": "O atleta executa livremente os 4 tipos de apelo (direto, cruzado, contra-apelo, arredondado) em sequência contra um defensor semi-ativo. Sem instrução do coach — escolha autónoma baseada na posição do defensor. Aquecimento técnico e recordação de todos os conceitos.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Meta: executar os 4 tipos pelo menos 2x cada"], "tip": "⚡ Última oportunidade de consolidar os automatismos antes do jogo final de avaliação", "warm": true}, {"sec": "Situações de Avaliação", "id": "E1", "n": "Avaliação 1 — Apelos + Finalização", "d": "Situação 1v1+GR. O atleta deve escolher o apelo correto para se libertar do defensor e finalizar com a decisão certa face ao GR. O coach avalia em silêncio: qualidade do apelo, timing, leitura do GR, decisão de remate.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Coach: avalia sem intervir"], "tip": "⚡ Avaliar os critérios definidos no início do plano: houve progressão real nestas 10 sessões?", "warm": false}, {"sec": "Situações de Avaliação", "id": "E2", "n": "Avaliação 2 — Centro + Coordenação", "d": "2 atacantes + 2 centreurs + 2 defensores + GR. Os atacantes coordenam livremente: passe fantasma, apelos complementares, profundidade e apoio. O coach avalia a comunicação, a leitura mútua e a qualidade das finições.", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Coach: observar sem intervir"], "tip": "⚡ Procurar sinais de automatismo: os dois atacantes antecipam os movimentos um do outro?", "warm": false}, {"sec": "Situações de Avaliação", "id": "E3", "n": "Avaliação 3 — Pressing e Transição", "d": "Jogo posicional. O coach avalia exclusivamente o comportamento defensivo dos atacantes: identificam os indicadores de pressing? Fecham o eixo? Fazem o apelo arredondado para fechar o retorno? Transitam imediatamente após perda?", "min": 15, "blocks": [], "params": ["Duração: 15 min", "Foco: comportamento defensivo dos ATK"], "tip": "⚡ Comparar com a sessão 7 — o atleta progrediu na leitura dos indicadores de pressing?", "warm": false}, {"sec": "Jogo Final de Integração", "id": "F1", "n": "Jogo de Integração — Regras Acumuladas", "d": "Jogo de campo completo com regras especiais que integram todos os conceitos trabalhados. Sistema de pontuação elaborado que recompensa os comportamentos corretos dos atacantes.", "min": 30, "blocks": [["Sistema de Pontuação", ["Golo = 1 ponto", "Golo em 1 toque = 2 pontos", "Golo após passe fantasma = 3 pontos", "Recuperação por pressing alto = 1 ponto bónus", "Golo após transição direta (<5s) = 2 pontos"]], ["Estrutura", ["3 períodos de 10 min", "Descanso de 3 min entre períodos", "Debriefing individual após cada período", "Análise final: pontos fortes e áreas a desenvolver"]]], "params": ["Duração: 3x10 min", "Debriefing final: 15 min"], "tip": "⚡ O sistema de pontuação torna todos os comportamentos trabalhados \"visíveis\" para o atleta — reforço positivo dos conceitos corretos", "warm": false}]}]}, "de": {"ata": [{"t": "Orientierter Ballkontakt & Explosivstart", "sub": "Der erste Kontakt nach dem Empfang entscheidet alles. Diese Einheit automatisiert den orientierten ersten Kontakt in Richtung Torchance und den explosiven Start in den Raum.", "phase": 1, "obj": [["Fokus", ["Technik · ~90 Kontakte"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Dynamische Mobilität + Aktivierungssprints", "d": "Hüftkreise, Schulterrotationen, Beinpendel. Danach 4×20m progressiv (60→90% Geschwindigkeit).", "min": 12, "blocks": [["Übungen", ["Hüftmobilität (2×10): 10 Kreise je Seite, langsam und kontrolliert.", "Progressiver Sprint (4×20m): 20m — 60%, 70%, 80%, 90% maximale Geschwindigkeit.", "Laterale Aktivierung (3×10m): Seitwärtsläufe mit Armarbeit über 10m, je Seite."]]], "params": ["Dauer: 12 min", "Intensität: 60→90%"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Orientierter Ballkontakt — Seitenpass", "d": "Server spielt lateral. Spieler orientiert mit dem ersten Kontakt in den Korridor und beschleunigt sofort auf 8m. Wechsel Seite nach jeder Serie.", "min": 18, "blocks": [["Übungen", ["Seitenpass + 1. Kontakt rechts (4×8): Ball kommt von links — 1. Kontakt nach rechts orientieren, sofort beschleunigen.", "Seitenpass + 1. Kontakt links (4×8): Ball kommt von rechts — 1. Kontakt nach links orientieren, sofort beschleunigen.", "Variante: Hohe Bälle (3×6): Server spielt halbhohe Bälle — Spieler dämpft und orientiert in einer Bewegung."]]], "params": ["Reps: ~88 Kontakte", "Pause: 30 Sek zwischen Serien"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Explosivstart nach Ballkontakt", "d": "Nach dem orientierten 1. Kontakt: maximaler Sprint auf 10m mit Richtungswechsel am Hütchen. Fokus: die ersten 3 Schritte nach Kontakt.", "min": 15, "blocks": [["Übungen", ["Kontakt + Sprint gerade (5×5): Orientierter Kontakt → Sprint 10m gerade → Abschluss auf Tor.", "Kontakt + Sprint diagonal (4×5): Orientierter Kontakt → diagonaler Sprint 12m → Abschluss."]]], "params": ["Sprints: 45 Explosivstarts", "Fokus: Erste 3 Schritte"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Vollsequenz: Empfang → Sprint → Abschluss", "d": "Verknüpfung beider Blöcke. Spieler empfängt, orientiert, beschleunigt und schließt mit Flanke oder Schuss ab. Abwechselnd links/rechts.", "min": 22, "blocks": [["Übungen", ["Sequenz rechts (4×5): Empfang links → Kontakt rechts → Sprint 15m → flache Flanke oder Schuss.", "Sequenz links (4×5): Empfang rechts → Kontakt links → Sprint 15m → Flanke oder Schuss.", "Sequenz mit TW (3×4): Gleiche Sequenz — TW aktiv, muss reagieren. Spieler entscheidet: Schuss oder Flanke."]]], "params": ["Abschlüsse: ~55", "TW: letzte 3 Serien aktiv"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Dehnung + Einheitenanalyse", "d": "Statische Dehnung Quadrizeps, Ischio, Wade je 30 Sek. Mentale Analyse: Was war heute der schwierigste Moment? Notieren für nächste Einheit.", "min": 8, "blocks": [], "params": ["Dehnung: 4 Muskelgruppen", "Analyse: 1 Notiz für Einheit 2"], "tip": "", "warm": false}]}, {"t": "Dribbling 1v1 — Explosion & Rhythmuswechsel", "sub": "Das Dribbling-Repertoire des Stürmers entwickeln. Falsche Abbremsung, Explosivstart, plötzlicher Schnitt — gegen simulierten Druck durch Mannequins.", "phase": 1, "obj": [["Fokus", ["Dribbling · ~120 Dribles"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Freies Dribbling + Technische Aktivierung", "d": "Freies Dribbling im 20×20m Raum. Auf Trainersignal: Richtungswechsel. Innenrist, Außenrist, Sohle abwechseln.", "min": 12, "blocks": [["Übungen", ["Freies Dribbling (8 min): 20×20m Raum, Richtungswechsel auf Signal, alle Kontaktflächen verwenden.", "Technische Schnelligkeitsläufe (4×15m): 4×15m mit Ball, maximale Beschleunigung im letzten Drittel."]]], "params": ["Flächen: Innen / Außen / Sohle", "Tempo: Mittel → Maximum"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Slalom + Explosiver Abschluss", "d": "5 Hütchen in Linie (je 1.5m). Langsamer technischer Slalom → explosiver Sprint auf letzten 10m → Abschluss. Seiten wechseln.", "min": 15, "blocks": [["Übungen", ["Slalom rechts + Abschluss (5×5): Langsam durch 5 Hütchen → Explosion nach rechts → Schuss auf Tor.", "Slalom links + Abschluss (5×5): Langsam durch 5 Hütchen → Explosion nach links → Schuss auf Tor."]]], "params": ["Reps: 50 Slaloms", "Fokus: Rhythmuswechsel"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Dribbling am Mannequin + Schnitt", "d": "Mannequin = Verteidiger. Spieler nähert sich langsam, führt technische Geste aus und explodiert seitlich. 2 verschiedene Gesten pro Block.", "min": 18, "blocks": [["Übungen", ["Übersteiger + Rechtssprint (4×6): Übersteiger am Mannequin → Explosion nach rechts → Schuss.", "Außenristschnitt + Linkssprint (4×6): Außenristschnitt → Explosion nach links → Schuss.", "Falscher Start + Geradsprint (4×5): Falsche Abbremsung → Explosion gerade durch → Schuss."]]], "params": ["Gesten: Min. 3 verschiedene", "Reps: ~85"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Doppelmannequin — Rhythmuswechsel", "d": "Zwei Mannequins im Winkel. Beim ersten verlangsamen, beim zweiten beschleunigen. Simuliert Korridor mit 2 Verteidigern.", "min": 22, "blocks": [["Übungen", ["Doppelmannequin Standard (5×5): 1. Mannequin: Geste + Verlangsamung. 2. Mannequin: Explosion. Abschluss danach.", "Doppelmannequin Freiheit (4×5): Gleiche Struktur — Spieler wählt Geste frei. Trainer bewertet Qualität.", "Mit Zeitdruck (4×4): Gleiche Übung — Trainer stoppt. Unter 4 Sek von Start bis Abschluss."]]], "params": ["Timing: <4 Sek Ziel", "TW: aktiv in letzten Serien"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Leichtes Dribbeln + Feedback", "d": "Lockeres Dribbling ohne Intensität. Trainer gibt individuelles Feedback zu jeder Geste. Welche Geste war heute stärkste?", "min": 8, "blocks": [], "params": ["Gesten bewertet: 3", "Notiz: Stärkste Geste für Einheit 3"], "tip": "", "warm": false}]}, {"t": "Schwacher Fuss — Grundlagen & Automatisierung", "sub": "Einheit vollständig dem schwachen Fuß gewidmet. Volumen vor Geschwindigkeit — technischen Komfort aufbauen bevor Intensität gefordert wird.", "phase": 1, "obj": [["Fokus", ["Schwacher Fuss · ~100% schwacher Fuss"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Wandpässe Schwacher Fuss", "d": "Pässe gegen Wand auf 5m — ausschließlich schwacher Fuß. Fokus: Knöchelposition, Blick auf Kontaktpunkt. 10 Minuten kontinuierlich.", "min": 10, "blocks": [["Übungen", ["Wandpass 5m (10 min): Innenrist schwacher Fuß, gleichmäßiger Rhythmus, kein starker Fuß."]]], "params": ["Fuß: 100% schwach", "Fokus: Knöchelspannung"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Torschuss Schwacher Fuss — Statisch", "d": "Ball ruhend auf verschiedenen Distanzen (12m, 15m, 18m). Technischer Fokus: Balance, Risttreff, Follow-through. Kein Zeitdruck.", "min": 18, "blocks": [["Übungen", ["Schuss aus 12m (5×6): Ruhender Ball, Anlauf 4 Schritte, Risttreff, Blick auf Ball.", "Schuss aus 15m (5×5): Ruhender Ball, längerer Anlauf, mehr Kraft — Technik bleibt gleich.", "Schuss aus 18m (4×5): Ruhender Ball, Fokus auf Genauigkeit nicht Kraft."]]], "params": ["Schüsse: ~95 statisch", "KPI: % eingerahmt"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Torschuss Schwacher Fuss — In Bewegung", "d": "Dribbling mit starkem Fuß → Umstellung auf schwachen Fuß → Schuss. Simuliert das Einschneiden des invertierten Stürmers.", "min": 18, "blocks": [["Übungen", ["Dribbling + Umstellung + Schuss (5×6): 5 Schritte mit starkem Fuß → letzter Kontakt übergibt an schwachen → Schuss.", "Seitenempfang + Schuss schwach (4×6): Ball kommt lateral → schwacher Fuß empfängt und schießt direkt."]]], "params": ["Reps: ~54 Schüsse", "KPI: Eingerahmte % Bewegung"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Flanke Schwacher Fuss — Von der Grundlinie", "d": "Von der gegenüberliegenden Seite: Flanke mit schwachem Fuß. Drei Flankentypen: flach, halbe Höhe, hoher Ball zweiter Pfosten.", "min": 21, "blocks": [["Übungen", ["Flache Flanke schwach (4×5): Grundlinie, schwacher Fuß, flach und scharf zum ersten Pfosten.", "Halbhohe Flanke schwach (4×5): Grundlinie, schwacher Fuß, halbhohe Flanke zum Elfmeterpunkt.", "Hohe Flanke zweiter Pfosten (4×4): Grundlinie, schwacher Fuß, hoher Ball für Lauf am zweiten Pfosten."]]], "params": ["Flanken: ~56 gesamt", "TW + Stürmer: optional"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Analyse Schwacher Fuss", "d": "Dehnung + Notiz: Welche Aktion mit schwachem Fuß war heute am schwierigsten? Was hat technisch geholfen? Priorität für nächste Einheit.", "min": 8, "blocks": [], "params": ["Notiz: 1 technische Anpassung", "Ziel: % Steigerung nächste EH"], "tip": "", "warm": false}]}, {"t": "Tiefenlauf & Ballempfang in Bewegung", "sub": "Timing des Tiefenlaufs im Korridor trainieren. Empfang im Sprint ohne Körperstopp — der erste Kontakt begleitet die Laufgeschwindigkeit.", "phase": 2, "obj": [["Fokus", ["Tiefenlauf · ~80 Läufe"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Aktivierungssprints mit Ball", "d": "4×30m Ball führen in steigender Geschwindigkeit. Letztes Hütchen: Richtungswechsel ohne zu stoppen. Aktiviert motorische Reflexe.", "min": 12, "blocks": [["Übungen", ["Ballführung progressiv (4×30m): 30m mit Ball, letztes Drittel maximal. Richtungswechsel ohne Stopp."]]], "params": ["Tempo: Progressiv bis 95%", "Fokus: Kein Stopp am Hütchen"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Tiefenlauf mit visuellem Signal", "d": "Spieler wartet auf Signal des Servers (Armheben). Sprint 15m, Ball im Raum empfangen, in Bewegung kontrollieren, flanken oder schießen.", "min": 18, "blocks": [["Übungen", ["Tiefenlauf auf Signal (5×5): Arm des Servers = Start. Sprint 15m, Ball empfangen, Abschluss ohne Stopp.", "Variante: Ball zeitverzögert (4×5): Server verzögert 0.5 Sek — Spieler muss Lauf anpassen."]]], "params": ["Läufe: 45", "KPI: % saubere Empfänge"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Tiefenlauf mit Abseits-Linie", "d": "Mannequins bilden Abwehrlinie. Spieler startet erst wenn Server Ball berührt — trainiert echtes Abseits-Timing.", "min": 18, "blocks": [["Übungen", ["Standard Tiefenlauf Linie (5×6): 3 Mannequins als Abwehrlinie. Start bei Ballkontakt Server. Sprint, Empfang, Abschluss.", "Linie + TW heraus (4×4): TW kommt bis Elfmeterpunkt heraus. Spieler entscheidet: Chip, Schuss oder Dribbling."]]], "params": ["Timing: Bei Ballkontakt starten", "Läufe: 46"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Tiefenlauf + 1v1 mit TW", "d": "Nach Empfang in Bewegung — TW aktiv. Spieler entscheidet frei: Schuss, Chip oder Dribbling. Keine vorgegebene Lösung.", "min": 19, "blocks": [["Übungen", ["1v1 TW — freie Lösung (5×4): Spieler entscheidet im letzten Meter. Trainer beobachtet und analysiert Entscheidung.", "Zeitdruck 1v1 (4×4): Gleiche Übung — Trainer stoppt nach 3 Sek. Alles nach 3 Sek zählt nicht."]]], "params": ["Entscheidungen: ~36", "Analyse: Welche Lösung am häufigsten"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Timing-Analyse", "d": "Trainer bespricht Momente zu früh / zu spät. Definiert visuellen Cue für nächste Einheit.", "min": 8, "blocks": [], "params": ["Cue definiert: Ja/Nein", "Notiz: Timing-Anpassung"], "tip": "", "warm": false}]}, {"t": "Flankenqualität — 4 Arten & Entscheidung", "sub": "Die 4 Hauptflankenarten des Stürmers beherrschen und die richtige Variante situativ entscheiden — nicht nach Anlauf, sondern vor dem Anlauf.", "phase": 2, "obj": [["Fokus", ["Flanken · ~100 Flanken"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Lange Aktivierungspässe", "d": "Diagonale Pässe auf 30–40m bilateral zur Aktivierung der Flankenmuskulatur. 10 Minuten wechselseitig.", "min": 10, "blocks": [["Übungen", ["Lange Pässe bilateral (10 min): 30m und 40m diagonal, beide Füße abwechselnd, kontrollierte Technik."]]], "params": ["Distanz: 30–40m", "Füße: Bilateral"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "4 Flankenarten — Reine Technik", "d": "Von Grundlinie und äußerem Korridor: jede Art einzeln trainieren. 3×6 pro Art = 72 Flanken gesamt.", "min": 22, "blocks": [["Übungen", ["Flache Flanke erster Pfosten (3×6): Grundlinie, scharf und flach zum ersten Pfosten. Innenrist.", "Flache Flanke zweiter Pfosten (3×6): Grundlinie, flach durchgehend zum zweiten Pfosten.", "Halbhohe Flanke Elfmeterpunkt (3×6): Vom Korridor, halbhoher Ball auf den Elfmeterpunkt.", "Hoher Ball zweiter Pfosten (3×6): Grundlinie, hoher Ball für Lauf am zweiten Pfosten."]]], "params": ["Flanken: 72", "KPI: % verwertbar je Typ"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Flanken mit Entscheidung", "d": "Trainer signalisiert nach dem Start welcher Typ. Spieler entscheidet und führt in Geschwindigkeit aus.", "min": 16, "blocks": [["Übungen", ["Flanke auf Signal (4×6): Start → Trainer ruft Typ (flach/hoch/halb) → Spieler führt aus. Kein Zögern."]]], "params": ["Entscheidungen: 24", "Reaktionszeit: <1 Sek"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Sprint + Flanke mit TW & Stürmer", "d": "Vollsequenz: Ball empfangen, beschleunigen, Linie erreichen, flanken für ankommenden Stürmer. Stürmer macht Lauf zum richtigen Pfosten.", "min": 19, "blocks": [["Übungen", ["Vollsequenz rechts (4×4): Empfang → Sprint 20m → Grundlinie → Flanke für Stürmer.", "Vollsequenz links (4×4): Spiegelverkehrt von links.", "Entscheidungssequenz (3×3): Stürmer macht 2 verschiedene Läufe — Flanker entscheidet welchen er anspielen will."]]], "params": ["Sequenzen: 33", "TW + Stürmer: beide aktiv"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Flanken-Feedback", "d": "Trainer bewertet jeden Flankentyp mit Note 1–10. Schwächster Typ definiert Priorität für nächste Einheit.", "min": 8, "blocks": [], "params": ["Bewertet: 4 Flankentypen", "Priorität: Schwächster Typ"], "tip": "", "warm": false}]}, {"t": "Kombinationsspiel mit Mittelfeld", "sub": "Kombinationsspiel zwischen Stürmer und Mittelfeldspieler trainieren — Wandpass, Dreieck, Rücken-zum-Tor-Kombination. Das häufigste Duett im Angriffsdrittel.", "phase": 2, "obj": [["Fokus", ["Kombination · ~80 Kombinationen"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Dreiecks-Pässe Aktivierung", "d": "3 Spieler im 8m Dreieck, 1-Touch-Pässe abwechselnd. 8 Minuten. Aktiviert Kommunikation und Bewegungs-Timing.", "min": 10, "blocks": [["Übungen", ["Dreieck 1-Touch (8 min): 8m Dreieck, alle Pässe 1-Touch, hohes Tempo, beide Seiten."]]], "params": ["Kontakte: 1-Touch", "Tempo: Hoch"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Wandpass — Stürmer als Wand", "d": "Mittelfeld spielt zum Stürmer, der als Wand zurücklegt. Mittelfeld läuft in den Raum und empfängt Rückgabe für Abschluss.", "min": 18, "blocks": [["Übungen", ["Wandpass Standard (5×6): MF → Stürmer → direkt zurück → MF schießt. Stürmer bleibt in Position.", "Wandpass + Spin (4×5): MF → Stürmer legt ab → dreht sofort und empfängt Rückgabe für Abschluss."]]], "params": ["Kombinationen: 46", "Fokus: Timing des Spinnings"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Rücken zum Tor + Kombination", "d": "Stürmer empfängt Rücken zum Tor, kombiniert mit Unterstützungsspieler, erhält Rückgabe und schließt ab.", "min": 18, "blocks": [["Übungen", ["Rücken empfangen + Ablage + Abschluss (5×5): Stürmer empfängt, legt ab, erhält Rückgabe im Raum, Abschluss.", "Rücken + Drehung + Schuss (4×5): Stürmer empfängt, dreht am Verteidiger (Mannequin) vorbei, schießt direkt."]]], "params": ["Kombinationen: 45", "Mannequin: simuliert Verteidiger"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Freie Kombination 3-Spieler", "d": "3 Spieler außerhalb des Strafraums. Keine vorgegebene Sequenz. Spieler kombinieren frei und schließen ab. Trainer beobachtet Räume.", "min": 21, "blocks": [["Übungen", ["Freie Kombination (5×4): A, B, C kombinieren frei. Ziel: Abschluss unter 5 Kontakten gesamt.", "Kombination mit Zeitdruck (4×4): Gleich — aber Trainer stoppt nach 6 Sek. Kein gültiger Abschluss danach."]]], "params": ["Ziel: Abschluss <5 Kontakte", "Zeit: <6 Sek"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Taktische Diskussion", "d": "Welche Kombination hat am häufigsten funktioniert? Warum? Trainer und Spieler analysieren gemeinsam.", "min": 8, "blocks": [], "params": ["Analyse: Top 2 Kombinationen", "Notiz: Für Einheit 7"], "tip": "", "warm": false}]}, {"t": "Abschluss aus dem Rücken zum Tor", "sub": "Spezifisch für den Mittelstürmer. Empfangen Rücken zum Tor, Körperschutz, Drehung zur freien Seite — und Abschluss in 2 Kontakten.", "phase": 2, "obj": [["Fokus", ["Rücken zum Tor · ~90 Aktionen"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Körperkontakt-Aktivierung", "d": "Paarweise: einer gibt leichten Druck von hinten, anderer schützt einen ruhenden Ball. Wechsel nach 60 Sek. Aktiviert Körperschutz-Instinkt.", "min": 10, "blocks": [["Übungen", ["Ball schützen (3×60 Sek): Partner drückt leicht von hinten, Spieler schützt Ball mit Körper. 60 Sek je Seite."]]], "params": ["Fokus: Körperposition", "Druck: Leicht → Mittel"], "tip": "", "warm": true}, {"sec": "Hauptblock 1", "id": "", "n": "Rücken Empfangen + Drehung", "d": "Spieler steht Rücken zum Tor. Server passt. Mit Körper als Schutzschild empfangen, zur freien Seite drehen. Schuss mit 2. Kontakt.", "min": 20, "blocks": [["Übungen", ["Drehung rechts (4×7): Empfang Rücken zum Tor → Drehung nach rechts (Mannequin links) → Schuss.", "Drehung links (4×7): Empfang Rücken zum Tor → Drehung nach links (Mannequin rechts) → Schuss.", "Lesen + Drehung (4×5): Vor Empfang: Spieler schaut auf Mannequin-Seite. Dreht zur freien Seite. Kein vorgegebener Weg."]]], "params": ["Aktionen: ~76", "KPI: % saubere Drehungen"], "tip": "", "warm": false}, {"sec": "Hauptblock 2", "id": "", "n": "Rücken + Schutz + Ablage", "d": "Empfang Rücken zum Tor, Körperschutz, Ablage zu Unterstützungsspieler, sofortiger Sprint in den Raum für Rückgabe.", "min": 18, "blocks": [["Übungen", ["Ablage + Sprint + Empfang (5×5): Empfang → Ablage → sofortiger Sprint in Raum → Rückgabe → Abschluss."]]], "params": ["Kombinationen: 25", "Fokus: Sprintstart nach Ablage"], "tip": "", "warm": false}, {"sec": "Anwendung", "id": "", "n": "Rücken + Druck Mannequin", "d": "Mannequin direkt hinter Spieler — simuliert angeklebten Verteidiger. Spieler muss Körperschutz maximieren und Drehraum schaffen.", "min": 19, "blocks": [["Übungen", ["Mannequin hinten + Drehung (5×5): Mannequin 50cm hinter Spieler. Empfang, maximaler Körperschutz, Drehung, Schuss.", "Mannequin + TW aktiv (4×4): Gleiche Situation, aber TW kommt heraus. Spieler entscheidet nach Drehung."]]], "params": ["Aktionen: 41", "Druck: Mannequin simuliert Verteidiger"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Analyse Körperposition", "d": "Trainer analysiert: War der Körperschutz konsequent? Wann hat die Drehung nicht funktioniert? Anpassung für nächste Einheit.", "min": 8, "blocks": [], "params": ["Analyse: Körperschutz-Qualität", "Notiz: Anpassung Einheit 8"], "tip": "", "warm": false}]}, {"t": "Zeitdruck — Entscheidung in 2 Sekunden", "sub": "Entscheidungszeit komprimieren. Stürmer empfängt mit schließendem Verteidiger — hat 2 Sekunden. Keine Zeit zum Zögern: schießen, drehen oder ablegen.", "phase": 3, "obj": [["Fokus", ["Zeitdruck · ~110 Situationen"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Entscheidungen ohne Ball", "d": "Trainer zeigt: 'schießen / drehen / ablegen'. Spieler führt Bewegung ohne Ball aus. Aktiviert Entscheidungs-Schaltkreis.", "min": 10, "blocks": [["Übungen", ["Entscheidungen ohne Ball (8 min): Trainer ruft Option. Spieler führt Bewegung ohne Ball aus. Schnell reagieren."]]], "params": ["Ziel: Sofort reagieren", "Fokus: Keine Pause zwischen Signal und Ausführung"], "tip": "", "warm": true}, {"sec": "Block 1 — 3 Sek", "id": "", "n": "Empfang + Entscheidung in 3 Sekunden", "d": "Trainer nennt Option im Moment des Passes. Spieler führt in 3 Sek aus. Etabliert Komfort-Basislinie.", "min": 15, "blocks": [["Übungen", ["3-Sek Entscheidung (4×7): Pass → Trainer sagt Option → Ausführung in 3 Sek. Überschreitung = ungültig."]]], "params": ["Zeit: 3 Sekunden", "Reps: 28"], "tip": "", "warm": false}, {"sec": "Block 2 — 2 Sek", "id": "", "n": "Empfang + Entscheidung in 2 Sekunden", "d": "Gleiches Format. Zeit auf 2 Sek reduziert mit akustischem Signal am Ende. Jede Aktion nach Signal ungültig.", "min": 18, "blocks": [["Übungen", ["2-Sek Entscheidung (4×8): Pass → Trainer sagt Option → Ausführung in 2 Sek. Akustisches Signal = Ende.", "1.5-Sek Herausforderung (3×5): Für fortgeschrittene Spieler: 1.5 Sek. Erlaubt nur sofortige Reaktion."]]], "params": ["Zeit: 2–1.5 Sekunden", "Reps: 47"], "tip": "", "warm": false}, {"sec": "Block 3 — Frei", "id": "", "n": "Freie Entscheidung — Kein Trainersignal", "d": "Spieler empfängt und entscheidet selbst anhand Mannequin-Positionierung. Kein Hinweis vom Trainer. Qualität der Entscheidung wird bewertet.", "min": 24, "blocks": [["Übungen", ["Freie Situation (6×5): Ball kommt, Mannequins verschiedene Positionen. Spieler liest und entscheidet.", "Mit Zeitdruck (4×5): Gleich, aber Trainer stoppt nach 2.5 Sek. Keine verlängerte Bedenkzeit."]]], "params": ["Entscheidungen: ~50", "KPI: % korrekte Lektüre der Situation"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Entscheidungs-Review", "d": "Trainer gibt Feedback zu Entscheidungsqualität — nicht Ausführung. Was wurde gut gelesen? Was falsch?", "min": 8, "blocks": [], "params": ["Feedback: Entscheidung, nicht Technik", "Notiz: Priorität Einheit 9"], "tip": "", "warm": false}]}, {"t": "Hochintensitäts-Kreislauf — Vollständiger Korridor", "sub": "Spielintensität simulieren. Vollständiger Kreislauf der alle Elemente verbindet: Tiefenlauf → Empfang → Dribbling → Flanke/Schuss. 8 Runden unter Ermüdung.", "phase": 3, "obj": [["Fokus", ["Hochintensität · 8 vollständige Runden"]]], "ex": [{"sec": "Aufwärmen", "id": "", "n": "Dynamische Mobilität + Sprints", "d": "Jogging 5 min → dynamische Mobilität 4 min → 4 Sprints 30m (80%, 85%, 90%, 95%).", "min": 14, "blocks": [["Übungen", ["Jogging (5 min): 5 Minuten lockeres Jogging, Körper aufwärmen.", "Dynamische Mobilität (4 min): Ausfallschritte, hohe Knie, Fersenanzug, Beinpendel.", "Aktivierungssprints (4×30m): 4×30m bei 80%, 85%, 90%, 95%."]]], "params": ["Gesamtdauer: 14 min", "Letzter Sprint: 95%"], "tip": "", "warm": true}, {"sec": "Kreislauf", "id": "", "n": "Vollständiger Korridor-Kreislauf — 6 Runden", "d": "Station 1: Sprint 20m + Empfang. Station 2: Dribbling Mannequin + Schnitt. Station 3: Flanke oder Schuss. 90 Sek Pause zwischen Runden.", "min": 36, "blocks": [["Übungen", ["Station 1: Sprint + Empfang (je Runde): 20m maximaler Sprint, Ball in Bewegung empfangen, erster Kontakt orientiert.", "Station 2: Dribbling + Schnitt (je Runde): Mannequin dribbeln, technische Geste, Explosivstart zum Korridor.", "Station 3: Abschluss (je Runde): Flanke oder Schuss je nach Position. TW aktiv. Volle Geschwindigkeit."]]], "params": ["Runden: 6", "Pause: 90 Sek zwischen Runden"], "tip": "", "warm": false}, {"sec": "Hochdruck-Final", "id": "", "n": "2 Finanzrunden unter Wettkampf-Druck", "d": "Gleiche Stationen + TW aktiv + verbaler Druck vom Trainer. Simuliert emotionalen Spieldruck. 2 Runden ohne Pause.", "min": 16, "blocks": [["Übungen", ["Finale Runde 1 (1×): Alle 3 Stationen, TW aktiv, Trainer gibt Druck verbal. Maximale Intensität.", "Finale Runde 2 (1×): Gleich, sofort nach Runde 1, keine Erholungspause."]]], "params": ["Runden Final: 2 ohne Pause", "TW + Druck: beide aktiv"], "tip": "", "warm": false}, {"sec": "Abkühlung", "id": "", "n": "Aktive Erholung + Vergleich", "d": "Langsames Gehen, Dehnung, Flüssigkeitszufuhr. Vergleich Qualität Runde 1 vs Runde 6: Abnahme über 25% = spezifisches Ausdauer-Defizit.", "min": 9, "blocks": [], "params": ["KPI Ausdauer: R1 vs R6 Qualität", "Grenzwert: >25% Abnahme = Priorität"], "tip": "", "warm": false}]}, {"t": "Abschlussbewertung — Vollständiges Stürmer-Profil", "sub": "5 Tests à 8 Minuten. Score 0–10 pro Pfeiler. Maximal 50 Punkte. Vergleich mit Einheit 1 für Fortschrittsmessung. Definiert nächste 10 Einheiten.", "phase": 3, "obj": [["Fokus", ["Bewertung · 5 Tests × 8 min"]]], "ex": [{"sec": "Test 1", "id": "", "n": "Orientierter Ballkontakt — 10 Empfänge", "d": "Score: Wie viele der 10 ergaben orientierten 1. Kontakt in den Korridor mit sofortigem Start? Maximum 10 Punkte.", "min": 8, "blocks": [["Übungen", ["10 Empfänge lateral (10 Reps): Server spielt, Spieler orientiert und startet sofort. Trainer bewertet jeden."]]], "params": ["Max: 10 Punkte", "KPI: Orientierung + Sofortstart"], "tip": "", "warm": false}, {"sec": "Test 2", "id": "", "n": "Dribbling 1v1 — 8 Versuche", "d": "Score: Wie viele der 8 überquerten die Linie nach Mannequin in maximaler Geschwindigkeit? Maximum 10 Punkte.", "min": 8, "blocks": [["Übungen", ["8 Dribbling-Versuche (8 Reps): Mannequin, technische Geste, Explosion. Trainer bewertet Geschwindigkeit und Technik."]]], "params": ["Max: 10 Punkte", "KPI: Linie überschritten in Geschwindigkeit"], "tip": "", "warm": false}, {"sec": "Test 3", "id": "", "n": "Schwacher Fuss — 10 Schüsse", "d": "Score: 1 Punkt eingerahmt, 2 Punkte Tor. Maximum 20 → umgerechnet auf /10.", "min": 8, "blocks": [["Übungen", ["10 Schüsse schwacher Fuß (10 Reps): Aus Bewegung, schwacher Fuß. 1 Pkt eingerahmt, 2 Pkt Tor."]]], "params": ["Max: 10 Punkte (20→/10)", "KPI: Eingerahmt + Tor"], "tip": "", "warm": false}, {"sec": "Test 4", "id": "", "n": "Flankenqualität — 10 Flanken", "d": "Score: 0 = draußen, 1 = verwertbar, 2 = perfekt (Stürmer-Zone). Trainer bewertet jeden. Maximum 10 Punkte.", "min": 8, "blocks": [["Übungen", ["10 Flanken gemischt (10 Reps): Trainer bestimmt Typ. Spieler führt aus. 0/1/2 Punkte je Flanke."]]], "params": ["Max: 10 Punkte", "KPI: Verwertbarkeit"], "tip": "", "warm": false}, {"sec": "Test 5", "id": "", "n": "Entscheidungsqualität — 10 Situationen", "d": "Trainer bewertet Entscheidungsqualität (nicht Ausführung). 0 = falsch, 1 = akzeptabel, 2 = optimal. Maximum 10 Punkte.", "min": 8, "blocks": [["Übungen", ["10 offene Situationen (10 Situ.): Verschiedene Mannequin-Positionen. Spieler empfängt und entscheidet. Nur Entscheidung bewertet."]]], "params": ["Max: 10 Punkte", "KPI: Entscheidungsqualität"], "tip": "", "warm": false}, {"sec": "Abschluss-Profil", "id": "", "n": "FLP Stürmer-Profil + Nächste Prioritäten", "d": "Summe der 5 Scores (max 50 Punkte). Vergleich mit Ausgangswert. Definition der 2 Prioritäten für den nächsten 10-Einheiten-Zyklus.", "min": 35, "blocks": [["Übungen", ["Profilauswertung (15 min): Trainer und Spieler besprechen jeden Wert. Stärken und Schwächen klar benennen.", "Nächste Prioritäten (10 min): Top 2 Bereiche für nächsten Zyklus. Konkrete Ziele definieren.", "Abschluss-Training (10 min): Freies Abschluss-Training — Spieler wählt seine Lieblingsübung. Keine Vorgabe."]]], "params": ["Max Score: 50 Punkte", "Ziel: >35 Pkt = nächstes Level"], "tip": "", "warm": false}]}]}};
Object.assign(PRO.pt,{"ata": [{"t": "Os 4 Apelos em Profundidade", "sub": "Atacar o espaço nas costas da defesa com timing e leitura", "phase": 1, "obj": [["Objetivos da Sessão", ["Dominar o apelo direto sem fora de jogo", "Executar o apelo cruzado para o pé preferido", "Criar contacto visual com o passador (adulto)", "Compreender o espaço decisivo atrás da linha"]], ["Comportamentos a Exigir", ["Arranque explosivo no momento certo", "Cabeça levantada antes do apelo", "Sinal com o braço ao passador", "Nunca parar: repetir o apelo se não receber"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Corridas de Ativação + Mudanças de Direção", "d": "Em espaço de 20×15 m, corridas com mudanças de direção ao sinal do adulto (voz ou braço): corrida → aceleração curta → parar → nova direção. Terminar com 3 sprints de 15 m a partir de meio movimento.", "min": 15, "blocks": [], "params": ["Séries: 3", "Sprint: 15 m", "Descanso: 30 s"], "tip": "⚡ O atacante raramente parte parado — simular a aceleração a partir de meio movimento", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Apelo Direto — Corrida nas Costas", "d": "O adulto está a 25 m com a bola. O atacante coloca-se ao lado de um cone-defensor. Ao contacto visual, arranca em linha reta para o espaço atrás do cone; o adulto passa em profundidade; finalizar na baliza.", "min": 12, "blocks": [], "params": ["Repetições: 8–10 por lado", "Descanso: 20 s"], "tip": "⚡ Não arrancar antes do passador estar pronto — contacto visual obrigatório", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Apelo Cruzado — Receber no Pé Preferido", "d": "2 cones a 4 m = centrais. O atacante parte do corredor exterior, finge o apelo direto e corta para o intervalo entre os cones. O adulto passa nesse intervalo; receção orientada para a baliza.", "min": 12, "blocks": [], "params": ["Repetições: 8 por lado", "Finalização: na baliza"], "tip": "⚡ Receber já de frente para a baliza, no pé forte", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Sequência: Apelo Direto + Apelo Cruzado", "d": "Dois apelos seguidos: o 1.º (direto) não recebe; reposicionamento rápido; o 2.º (cruzado) recebe e finaliza. Inverter a ordem a cada série.", "min": 15, "blocks": [], "params": ["Séries: 6", "Descanso: 30 s"], "tip": "⚡ Antes de um golo há muitos apelos no vazio — cada corrida cria espaço para a seguinte", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "1×1 de Profundidade com Finalização", "d": "O adulto passa em profundidade e depois persegue o atacante (oposição semi-ativa, partindo 2 m atrás). O atacante usa o apelo certo, recebe e finaliza na baliza (adulto na baliza ou cones nos cantos).", "min": 15, "blocks": [], "params": ["Repetições: 10", "Intensidade: alta"], "tip": "⚡ Avaliar: usou o apelo certo? Manteve a velocidade após receber?", "warm": false}]}, {"t": "Contra-Apelo e Apelo Arredondado", "sub": "Desequilibrar o defensor e gerir o fora de jogo com inteligência", "phase": 1, "obj": [["Objetivos da Sessão", ["Dominar o contra-apelo: atrair e picar", "Executar o apelo arredondado sem fora de jogo", "Enganar com o primeiro movimento", "Coordenar com o passador nos dois movimentos"]], ["Comportamentos a Exigir", ["Primeiro movimento convincente", "Mudança de direção explosiva", "Arredondado: correr paralelo à linha antes de entrar", "Comunicação clara com o passador"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Jogo de Sombra com o Adulto", "d": "Atleta e adulto frente a frente: o atleta lidera e muda de direção sem aviso; o adulto segue. Trocar papéis após 2 min. Terminar com 5 arranques de 10 m de costas: rodar e correr.", "min": 15, "blocks": [], "params": ["Duração: 2×3 min por papel", "Sprint final: 5×10 m"], "tip": "⚡ Ativa os reflexos de reação às costas", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Contra-Apelo — Aprendizagem", "d": "O atacante ao lado de um cone-defensor. Fase 1: 3–4 passos em direção ao adulto (apelo de apoio). Fase 2: explode para o espaço atrás do cone. O adulto passa no momento do contra-movimento.", "min": 15, "blocks": [], "params": ["Repetições: 10 por lado", "Finalização: sim"], "tip": "⚡ O apelo de apoio tem de ser convincente — o defensor tem de 'morder'", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Apelo Arredondado — Gerir o Fora de Jogo", "d": "Linha de 3 cones = defesa. O atacante acompanha a linha lateralmente e, quando o adulto bate a bola, mergulha em diagonal para a área. Filmar com o telemóvel para ver o fora de jogo.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Revisão: vídeo"], "tip": "⚡ Partir no momento exato do passe — a curva mantém-te em jogo mais tempo", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Escolha Livre — Qual Apelo?", "d": "O adulto coloca-se como defensor em posições diferentes (colado, longe, de frente). O atacante escolhe o apelo certo para cada posição; o adulto passa e finaliza.", "min": 15, "blocks": [], "params": ["Repetições: 12", "Debriefing: a cada 3"], "tip": "⚡ Perguntar: 'Qual apelo usaste? Porquê? Onde estava o defensor?'", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Competição de Apelos", "d": "12 apelos variados. 1 ponto por golo, 0,5 por apelo perfeito sem golo. Registar e superar na próxima sessão.", "min": 15, "blocks": [], "params": ["Repetições: 12", "Registo: pontos"], "tip": "⚡ A corrida tem valor mesmo sem receber", "warm": false}]}, {"t": "Jogo de Apoio — Costas para a Baliza", "sub": "Proteção de bola, devolução, giro e posição entre linhas", "phase": 1, "obj": [["Objetivos da Sessão", ["Proteger a bola de costas sob pressão", "Devolver de qualidade em 1 toque", "Saber quando girar e quando devolver", "Posicionar-se entre linhas"]], ["Comportamentos a Exigir", ["Corpo largo: braços e pernas", "Pé de apoio afastado da bola", "Cabeça levantada antes de receber", "Devolução precisa, não ao acaso"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Proteção Leve com o Adulto", "d": "Quadrado 6×6 m. O atleta conduz e protege; o adulto pressiona a 50%. Depois, passes de costas: receber com o corpo entre bola e cone-adversário e devolver.", "min": 15, "blocks": [], "params": ["Duração: 3×3 min"], "tip": "⚡ Nunca receber de frente para o adversário", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Proteção sob Pressão Direta", "d": "O atacante recebe de costas com o adulto colado. Objetivo: manter a bola 3 s e devolver para um cone-alvo ou girar para a frente quando o adulto não acompanha.", "min": 12, "blocks": [], "params": ["Repetições: 12", "Proteção: 3 s"], "tip": "⚡ Corpo largo, transferência de peso rápida", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Devolução e Desvio em 1 Toque", "d": "Dois cones-alvo em posições diferentes. O adulto passa; o atacante devolve de primeira para o alvo indicado, faz logo um apelo em profundidade, recebe novo passe e finaliza.", "min": 15, "blocks": [], "params": ["Séries: 6", "Intensidade: média-alta"], "tip": "⚡ Uma má devolução anula a jogada — precisão máxima", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Fixar e Libertar entre Linhas", "d": "2 pares de cones = linhas defensivas. O atacante move-se entre elas, pede a bola ao adulto e decide: girar e conduzir até à baliza, ou devolver e atacar a profundidade.", "min": 18, "blocks": [], "params": ["Duração: 3×5 min"], "tip": "⚡ Estar entre as linhas obriga os defensores a decidir", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Cadeia Completa — Apoio + Profundidade + Golo", "d": "1) Recebe de costas e protege; 2) devolve ao adulto; 3) faz um apelo à escolha; 4) recebe e finaliza. Integra as sessões 1, 2 e 3.", "min": 15, "blocks": [], "params": ["Repetições: 10", "Oposição: adulto semi-ativo"], "tip": "⚡ Avaliar as 3 fases: proteção, devolução e apelo", "warm": false}]}, {"t": "Finalização na Área", "sub": "Velocidade de execução, 1–2 toques, superfície do pé e leitura do goleiro", "phase": 2, "obj": [["Objetivos da Sessão", ["Finalizar a 1 toque com eficácia", "Ver a posição do goleiro antes de rematar", "Usar a superfície certa", "Manter velocidade sob pressão"]], ["Comportamentos a Exigir", ["A maioria dos golos nasce dentro da área", "A maioria é marcada a 1 ou 2 toques", "Muitos golos surgem após um esforço intenso", "Nunca parado dentro da área"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Finalização", "d": "Sprint de 10 m → receber do adulto → remate para os cantos (cones). Começar devagar e aumentar a velocidade. Os dois pés.", "min": 15, "blocks": [], "params": ["Repetições: 10 por pé", "Distância: 8–14 m"], "tip": "⚡ Desde o início: cabeça levantada para ver a baliza", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Finalização de 4 Ângulos", "d": "O adulto serve de 4 posições à volta da área. O atleta recebe e remata a 1 ou 2 toques. Alternar ângulos; mínimo 3 m de corrida antes de cada remate.", "min": 15, "blocks": [], "params": ["Repetições: 10 por ângulo", "Descanso: 20 s"], "tip": "⚡ Na área, um atacante parado é um atacante morto", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Finalizações em Sequência", "d": "3 finalizações seguidas: 1) condução + eliminar cone + remate; 2) tabela com o adulto + remate; 3) passe lateral + remate de primeira.", "min": 15, "blocks": [], "params": ["Séries: 6", "Descanso: 45 s"], "tip": "⚡ Avaliar o 3.º remate: cansado, mantém a técnica?", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Frente a Frente — Decisão Rápida", "d": "O adulto (na baliza) muda de posição a cada repetição. O atacante recebe em profundidade e decide: cruzado rasteiro, picar ou contornar.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ Decidir pela posição do goleiro, no último momento", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Desafio de Finalização", "d": "20 finalizações variadas. Golo = 1 ponto; a 1 toque = +0,5; decisão perfeita = +0,5. Registar.", "min": 15, "blocks": [], "params": ["Finalizações: 20"], "tip": "⚡ Comparar com a sessão 10", "warm": false}]}, {"t": "Marcar no Centro", "sub": "Apelos na área, espaço cego e timing no cruzamento", "phase": 2, "obj": [["Objetivos da Sessão", ["Usar o espaço cego do defensor", "Chegar em movimento ao cruzamento", "Atacar 1.º poste, 2.º poste e marca de penálti", "Rematar para o lado de onde veio o cruzamento"]], ["Comportamentos a Exigir", ["Corrida em curva", "Contra-movimento antes de atacar", "Atacar a bola, não esperar", "Remate a 1 toque"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Ativação de Cabeceamento e Volley", "d": "Cabeceamentos e volleys leves com bola lançada à mão pelo adulto a 5 m.", "min": 15, "blocks": [], "params": ["Repetições: 20"], "tip": "⚡ Ativar a técnica de 1 toque", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Espaço Cego", "d": "Cone-defensor na área. O atacante começa à frente dele, sai das costas (espaço cego) e ataca o cruzamento do adulto.", "min": 15, "blocks": [], "params": ["Repetições: 3×6"], "tip": "⚡ O defensor não pode ver a bola e a ti ao mesmo tempo", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Rematar de Onde Veio o Cruzamento", "d": "Cruzamento da direita: o remate redirecionado para o lado direito apanha o goleiro em contrapé. Alternar lados.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ O goleiro desloca-se com a bola — remata para trás dele", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "3 Zonas de Ataque", "d": "O adulto cruza; antes do cruzamento diz '1', '2' ou 'P' (1.º poste, 2.º poste, penálti). O atacante ataca a zona e finaliza.", "min": 12, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ Chegar no momento, não antes", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Desafio de Cruzamentos", "d": "15 cruzamentos variados. Contar golos e remates à baliza.", "min": 18, "blocks": [], "params": ["Cruzamentos: 15"], "tip": "⚡ Registar golos/15", "warm": false}]}, {"t": "A Arte do Frente a Frente com o Goleiro", "sub": "Ler o goleiro, esconder a intenção e decidir", "phase": 2, "obj": [["Objetivos da Sessão", ["Ler a posição do goleiro", "Escolher: rematar, picar ou contornar", "Esconder a intenção até ao fim", "Usar o corpo contra o defensor que persegue"]], ["Comportamentos a Exigir", ["Velocidade até ao remate", "Olhar para o goleiro, não para a bola", "Último toque a preparar o remate", "Calma"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Condução e Remate após Cone", "d": "Condução em velocidade → eliminar um cone → reta para a baliza → finalizar.", "min": 15, "blocks": [], "params": ["Repetições: 10"], "tip": "⚡ Condução com toques longos no espaço livre", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Goleiro Varia a Posição", "d": "O adulto na baliza adota uma de 3 posições (adiantado, na linha, a sair). O atacante lê e decide.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ Adiantado → picar; na linha → cruzado; a sair → contornar", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Esconder a Intenção", "d": "Armar o remate para um lado e rematar para o outro, ou fintar o remate e contornar.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ O corpo diz uma coisa, o pé faz outra", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Colocar-se na Corrida do Defensor", "d": "O adulto persegue a partir de trás. O atacante coloca o corpo na linha de corrida do adulto para o impedir de chegar.", "min": 12, "blocks": [], "params": ["Repetições: 10"], "tip": "⚡ Proteger o caminho, não só a bola", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Frente a Frente em Competição", "d": "12 frente a frente com o adulto na baliza. Golo = 1, decisão perfeita = +0,5.", "min": 18, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ Registar", "warm": false}]}, {"t": "Pressing e Jogo Defensivo do Avançado", "sub": "Fechar o eixo, orientar e recuperar alto", "phase": 2, "obj": [["Objetivos da Sessão", ["Pressionar com curva", "Fechar o passe para o centro", "Orientar o portador para a linha", "Recuperar e finalizar rápido"]], ["Comportamentos a Exigir", ["Gatilho: passe atrasado ou mau controlo", "Aproximação em curva", "Último passo travado", "Transição imediata após recuperar"]]], "ex": [{"sec": "Aquecimento", "id": "A1", "n": "Arranques e Travagens", "d": "Arranques de 5–10 m e travagens em 2 passos a sinal do adulto.", "min": 15, "blocks": [], "params": ["Repetições: 3×6"], "tip": "⚡ Pressionar é acelerar e travar", "warm": true}, {"sec": "Parte Principal", "id": "P1", "n": "Fechar o Eixo", "d": "O adulto (central) conduz; 2 cones = médios centrais. O avançado pressiona em curva, fecha o passe para os cones e obriga a jogar para a linha.", "min": 15, "blocks": [], "params": ["Repetições: 12"], "tip": "⚡ A curva tapa o passe enquanto pressionas", "warm": false}, {"sec": "Parte Principal", "id": "P2", "n": "Gatilhos de Pressão", "d": "O adulto recebe com bom ou mau controlo. O avançado só pressiona nos gatilhos.", "min": 12, "blocks": [], "params": ["Repetições: 15"], "tip": "⚡ Pressionar no momento certo vale mais que pressionar sempre", "warm": false}, {"sec": "Parte Principal", "id": "P3", "n": "Recuperar e Finalizar", "d": "Após roubar a bola ao adulto, finalizar em menos de 6 s.", "min": 15, "blocks": [], "params": ["Repetições: 10"], "tip": "⚡ Recuperar alto = golo perto", "warm": false}, {"sec": "Tarefa Final", "id": "F1", "n": "Jogo de Pressão", "d": "O adulto tenta manter a bola num quadrado 12×12 m. 3 rondas de 2 min; contar recuperações e golos.", "min": 18, "blocks": [], "params": ["Rondas: 3×2 min"], "tip": "⚡ Os avançados fazem as ações de pressão mais intensas — treina-as", "warm": false}]}, {"t": "Combinações com o Passador", "sub": "Tabelas, terceiro homem e passe para a corrida", "phase": 3, "obj": [["Objetivos da Sessão", ["Tabela
